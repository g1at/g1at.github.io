<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc">
<title id="title">Read timing can change the returned payload</title><desc id="desc">The capture client only saved bytes. It did not launch bash or execute the installer.</desc>
<rect x="0" y="0" width="1200" height="805" rx="0" fill="#F7F6F2"/>
<text x="48" y="40" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#087D78" font-weight="700">DISCORD FRIEND  /  07CTF  /  FIG. 02</text>
<text x="48" y="86" font-family="Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#14283F" font-weight="700">Read timing can change the returned payload</text>
<text x="48" y="122" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#617584" font-weight="400">The capture client only saved bytes. It did not launch bash or execute the installer.</text>
<line x1="48" y1="145" x2="1152" y2="145" stroke="#D9E1E4" stroke-width="1"/>
<rect x="48" y="172" width="1104" height="92" rx="12" fill="#FFFFFF" stroke="#D9E1E4"/>
<text x="70" y="205" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#087D78" font-weight="700">Shared prefix</text>
<text x="246" y="205" font-family="Consolas,monospace" font-size="21" fill="#14283F" font-weight="400">sleep &quot;${FORGESYNC_MIRROR_DELAY:-4.0}&quot;</text>
<text x="246" y="239" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#617584" font-weight="400">Then ~6 MiB of comments: enough to create backpressure when the consumer pauses.</text>
<rect x="48" y="299" width="1104" height="100" rx="12" fill="#FFFFFF" stroke="#D9E1E4"/>
<text x="72" y="338" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#14283F" font-weight="700">Continuous reading</text>
<text x="72" y="371" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#617584" font-weight="400">Client behavior</text>
<line x1="375" y1="349" x2="420" y2="349" stroke="#087D78" stroke-width="2"/>
<polygon points="420.00,349.00 412.10,353.31 412.10,344.69" fill="#087D78"/>
<text x="444" y="354" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#087D78" font-weight="700">Buffers keep draining</text>
<line x1="783" y1="349" x2="828" y2="349" stroke="#087D78" stroke-width="2"/>
<polygon points="828.00,349.00 820.10,353.31 820.10,344.69" fill="#087D78"/>
<text x="852" y="354" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#14283F" font-weight="700">Normal installer tail</text>
<rect x="48" y="423" width="1104" height="100" rx="12" fill="#FFF0D8" stroke="#D9E1E4"/>
<text x="72" y="462" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#14283F" font-weight="700">Pause reads for 8 s</text>
<text x="72" y="495" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#617584" font-weight="400">Client behavior</text>
<line x1="375" y1="473" x2="420" y2="473" stroke="#A95F06" stroke-width="2"/>
<polygon points="420.00,473.00 412.10,477.31 412.10,468.69" fill="#A95F06"/>
<text x="444" y="478" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#A95F06" font-weight="700">Buffers fill → backpressure</text>
<line x1="783" y1="473" x2="828" y2="473" stroke="#A95F06" stroke-width="2"/>
<polygon points="828.00,473.00 820.10,477.31 820.10,468.69" fill="#A95F06"/>
<text x="852" y="478" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#14283F" font-weight="700">Malicious installer tail</text>
<rect x="48" y="553" width="1104" height="112" rx="12" fill="#E7F4F1"/>
<text x="69" y="582" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#087D78" font-weight="700">Observed pause: 11,112 bytes = 249 bytes of headers + 10,863 bytes of body.</text>
<text x="69" y="612" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#31485B" font-weight="400">Pause: 8.0 s; full response body: 6,361,925 bytes; no response execution.</text>
<text x="69" y="642" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#31485B" font-weight="400">In the victim pipeline, bash sleeps; the read-only capture program simulated that effect.</text>
<text x="48" y="698" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#617584" font-weight="400">Conceptual diagram: server-side timing selection is inferred from the hint; differing bytes were observed.</text>
<text x="48" y="723" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#617584" font-weight="400">The pause position and network interface both changed; proxy buffering was not isolated experimentally.</text>
<line x1="48" y1="749" x2="1152" y2="749" stroke="#D9E1E4" stroke-width="1"/>
<text x="48" y="776" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#617584" font-weight="400">Capture: 2026-09-20 12:39 UTC · https://34.56.224.40/install · no response execution.</text>
