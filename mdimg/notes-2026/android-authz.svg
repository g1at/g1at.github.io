<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 625" role="img" aria-labelledby="title desc">
  <title id="title">认证成功不等于有权访问任意对象</title>
  <desc id="desc">用账户 A 的有效凭据请求账户 B 的订单，服务端必须检查对象归属</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="625" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">认证成功不等于有权访问任意对象</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">用账户 A 的有效凭据请求账户 B 的订单，服务端必须检查对象归属</text>
  <rect x="55" y="145" width="210" height="165" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="55" y="145" width="7" height="165" rx="3.5" fill="#2563eb"/><text x="79" y="179" class="box-title" text-anchor="start" fill="#172033" font-size="20">测试账户 A</text><text x="79" y="209" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="79" dy="0">有效 Token A</tspan><tspan x="79" dy="1.35em">请求：GET /orders/B-42</tspan><tspan x="79" dy="1.35em">TLS 已建立</tspan></text><line x1="265" y1="225" x2="390" y2="225" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="327.5" y="215.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">HTTPS</text><rect x="390" y="125" width="250" height="205" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="390" y="125" width="7" height="205" rx="3.5" fill="#7c3aed"/><text x="414" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">服务端</text><text x="414" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="414" dy="0">1. 验证 Token → A</tspan><tspan x="414" dy="1.35em">2. 加载订单 B-42</tspan><tspan x="414" dy="1.35em">3. 检查 owner == A</tspan><tspan x="414" dy="1.35em">4. 决定是否返回</tspan></text><line x1="640" y1="225" x2="735" y2="225" stroke="#7c3aed" stroke-width="3"  marker-end="url(#arrow-7c3aed)"/><text x="687.5" y="215.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">读取对象</text><rect x="735" y="145" width="170" height="165" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2" /><rect x="735" y="145" width="7" height="165" rx="3.5" fill="#b96800"/><text x="759" y="179" class="box-title" text-anchor="start" fill="#172033" font-size="20">订单 B-42</text><text x="759" y="209" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="759" dy="0">owner = B</tspan><tspan x="759" dy="1.35em">金额 / 地址</tspan><tspan x="759" dy="1.35em">敏感业务对象</tspan></text><rect x="85" y="395" width="350" height="130" rx="14" fill="#fff1f2" stroke="#cbd5e1" stroke-width="2" /><rect x="85" y="395" width="7" height="130" rx="3.5" fill="#c2413c"/><text x="109" y="429" class="box-title" text-anchor="start" fill="#172033" font-size="20">错误实现</text><text x="109" y="459" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="109" dy="0">Token 有效 → 直接返回 B-42</tspan><tspan x="109" dy="1.35em">结果：A 能读取 B 的对象</tspan></text><rect x="525" y="395" width="350" height="130" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="525" y="395" width="7" height="130" rx="3.5" fill="#16845b"/><text x="549" y="429" class="box-title" text-anchor="start" fill="#172033" font-size="20">正确边界</text><text x="549" y="459" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="549" dy="0">Token 有效 + 对象归属检查</tspan><tspan x="549" dy="1.35em">owner(B-42) ≠ A → 403</tspan></text><text x="480" y="575" class="label" text-anchor="middle" fill="#172033" font-weight="650">TLS 保护传输与服务器身份；对象级授权仍由业务代码完成</text>
</svg>
