  <text x="48" y="52" class="title" text-anchor="start">MQTT 3.1.1 QoS 1 PUBLISH 字节拆解</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">抓包样例：主题 lab/temp，Packet Identifier 为 1，负载为 ASCII 23.5</text>
  <rect x="55" y="140" width="80" height="80" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" /><text x="95.0" y="169" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">33</text><line x1="55" y1="184" x2="135" y2="184" stroke="#7c3aed" stroke-width="1"/><text x="95.0" y="208" class="tiny" text-anchor="middle" fill="#5f6b7a">固定头</text><rect x="135" y="140" width="80" height="80" rx="5" fill="#f8fafc" stroke="#5f6b7a" stroke-width="1.6" /><text x="175.0" y="169" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">10</text><line x1="135" y1="184" x2="215" y2="184" stroke="#5f6b7a" stroke-width="1"/><text x="175.0" y="208" class="tiny" text-anchor="middle" fill="#5f6b7a">剩余长度</text><rect x="215" y="140" width="110" height="80" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /><text x="270.0" y="169" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">00 08</text><line x1="215" y1="184" x2="325" y2="184" stroke="#2563eb" stroke-width="1"/><text x="270.0" y="208" class="tiny" text-anchor="middle" fill="#5f6b7a">Topic 长度</text><rect x="325" y="140" width="270" height="80" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /><text x="460.0" y="169" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">6c 61 62 2f 74 65 6d 70</text><line x1="325" y1="184" x2="595" y2="184" stroke="#2563eb" stroke-width="1"/><text x="460.0" y="208" class="tiny" text-anchor="middle" fill="#5f6b7a">Topic = lab/temp</text><rect x="595" y="140" width="110" height="80" rx="5" fill="#fff7ed" stroke="#b96800" stroke-width="1.6" /><text x="650.0" y="169" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">00 01</text><line x1="595" y1="184" x2="705" y2="184" stroke="#b96800" stroke-width="1"/><text x="650.0" y="208" class="tiny" text-anchor="middle" fill="#5f6b7a">Packet ID</text><rect x="705" y="140" width="200" height="80" rx="5" fill="#ecfdf5" stroke="#16845b" stroke-width="1.6" /><text x="805.0" y="169" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">32 33 2e 35</text><line x1="705" y1="184" x2="905" y2="184" stroke="#16845b" stroke-width="1"/><text x="805.0" y="208" class="tiny" text-anchor="middle" fill="#5f6b7a">Payload = 23.5</text><line x1="95" y1="250" x2="95" y2="224" stroke="#7c3aed" stroke-width="2"  marker-end="url(#arrow-7c3aed)"/><rect x="55" y="260" width="145" height="34" rx="17.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" /><text x="127.5" y="283.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">Type = 3 (PUBLISH)</text><rect x="220" y="260" width="115" height="34" rx="17.0" fill="#f8fafc" stroke="#5f6b7a" stroke-width="1.5" /><text x="277.5" y="283.0" class="small" text-anchor="middle" fill="#5f6b7a" font-weight="650">DUP = 0</text><rect x="355" y="260" width="115" height="34" rx="17.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="412.5" y="283.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">QoS = 1</text><rect x="490" y="260" width="135" height="34" rx="17.0" fill="#ecfdf5" stroke="#16845b" stroke-width="1.5" /><text x="557.5" y="283.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">RETAIN = 1</text><text x="660" y="283" class="mono" text-anchor="start" fill="#5f6b7a" font-size="17">0x33 = 0011 0011</text><rect x="50" y="335" width="260" height="125" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="50" y="335" width="7" height="125" rx="3.5" fill="#7c3aed"/><text x="74" y="369" class="box-title" text-anchor="start" fill="#172033" font-size="20">固定头</text><text x="74" y="399" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="74" dy="0">消息类型 0011</tspan><tspan x="74" dy="1.35em">DUP / QoS / RETAIN</tspan><tspan x="74" dy="1.35em">本例：QoS 1 + retained</tspan></text><rect x="350" y="335" width="260" height="125" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="350" y="335" width="7" height="125" rx="3.5" fill="#2563eb"/><text x="374" y="369" class="box-title" text-anchor="start" fill="#172033" font-size="20">可变头</text><text x="374" y="399" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="374" dy="0">UTF-8 Topic Name</tspan><tspan x="374" dy="1.35em">QoS &gt; 0 时含 Packet ID</tspan><tspan x="374" dy="1.35em">本例 ID = 1</tspan></text><rect x="650" y="335" width="260" height="125" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="650" y="335" width="7" height="125" rx="3.5" fill="#16845b"/><text x="674" y="369" class="box-title" text-anchor="start" fill="#172033" font-size="20">Payload</text><text x="674" y="399" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="674" dy="0">应用字节不由 MQTT</tspan><tspan x="674" dy="1.35em">替你解释编码</tspan><tspan x="674" dy="1.35em">本例 ASCII 23.5</tspan></text><text x="480" y="505" class="label" text-anchor="middle" fill="#5f6b7a">Remaining Length = 0x10 = 后续 16 字节（不含前两个字节）</text>
</svg>
