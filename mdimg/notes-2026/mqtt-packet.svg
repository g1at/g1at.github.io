<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" role="img" aria-labelledby="title desc">
  <title id="title">MQTT 3.1.1 QoS 1 PUBLISH 字节拆解</title>
  <desc id="desc">抓包样例：主题 lab/temp，Packet Identifier 为 1，负载为 ASCII 23.5</desc>
