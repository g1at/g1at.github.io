="#172033" font-weight="700" font-size="18">16</text><text x="708" y="413" class="tiny" text-anchor="middle" fill="#c2413c" font-weight="650">电池正极</text><rect x="75" y="500" width="245" height="100" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="75" y="500" width="7" height="100" rx="3.5" fill="#2563eb"/><text x="99" y="534" class="box-title" text-anchor="start" fill="#172033" font-size="20">CAN</text><text x="99" y="564" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="99" dy="0">6 = CAN-H</tspan><tspan x="99" dy="1.35em">14 = CAN-L</tspan></text><rect x="358" y="500" width="245" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="358" y="500" width="7" height="100" rx="3.5" fill="#5f6b7a"/><text x="382" y="534" class="box-title" text-anchor="start" fill="#172033" font-size="20">参考地</text><text x="382" y="564" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="382" dy="0">4 = chassis ground</tspan><tspan x="382" dy="1.35em">5 = signal ground</tspan></text><rect x="640" y="500" width="245" height="100" rx="14" fill="#fff1f2" stroke="#cbd5e1" stroke-width="2" /><rect x="640" y="500" width="7" height="100" rx="3.5" fill="#c2413c"/><text x="664" y="534" class="box-title" text-anchor="start" fill="#172033" font-size="20">电源</text><text x="664" y="564" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="664" dy="0">16 = battery positive</tspan><tspan x="664" dy="1.35em">测量后再连接设备</tspan></text><text x="480" y="630" class="small" text-anchor="middle" fill="#5f6b7a">从线束背面观察时左右会镜像；以连接器编号和车型资料为准</text>
