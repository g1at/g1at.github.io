all" text-anchor="middle" fill="#5f6b7a" font-weight="650">GND_B</text><rect x="620" y="377" width="95" height="34" rx="17.0" fill="#ffffff" stroke="#c2413c" stroke-width="1.5" /><text x="667.5" y="400.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">VCC_B</text><line x1="340" y1="230" x2="620" y2="230" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="480.0" y="220.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">数据 A → B</text><line x1="620" y1="285" x2="340" y2="285" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="480.0" y="275.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">数据 B → A</text><line x1="340" y1="340" x2="620" y2="340" stroke="#5f6b7a" stroke-width="4"/><text x="480" y="330" class="small" text-anchor="middle" fill="#5f6b7a" font-weight="650">公共参考地</text><line x1="340" y1="395" x2="620" y2="395" stroke="#c2413c" stroke-width="3" stroke-dasharray="10 8"/><line x1="452" y1="375" x2="508" y2="415" stroke="#c2413c" stroke-width="4"/><line x1="508" y1="375" x2="452" y2="415" stroke="#c2413c" stroke-width="4"/><text x="480" y="487" class="label" text-anchor="middle" fill="#c2413c" font-weight="650">VCC 是否连接取决于供电设计；先确认电平与参考地</text><rect x="170" y="530" width="260" height="34" rx="17.0" fill="#fff7ed" stroke="#b96800" stroke-width="1.5" /><text x="300.0" y="553.0" class="small" text-anchor="middle" fill="#b96800" font-weight="650">TTL UART ≠ RS-232 电平</text><rect x="530" y="530" width="260" height="34" rx="17.0" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" /><text x="660.0" y="553.0" class="small" text-anchor="middle" fill="#0891b2" font-weight="650">TX 与 RX 必须交叉</text>
