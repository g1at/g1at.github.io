  <text x="48" y="80" class="subtitle" text-anchor="start">示意接收端位时间偏长：采样点向右移动，越靠近帧末偏差越大</text>
  <text x="55" y="138" class="small" text-anchor="start" fill="#172033" font-weight="650">发送端位边界</text><line x1="90" y1="165" x2="90" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="129.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 0</text><line x1="168" y1="165" x2="168" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="207.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 1</text><line x1="246" y1="165" x2="246" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="285.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 2</text><line x1="324" y1="165" x2="324" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="363.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 3</text><line x1="402" y1="165" x2="402" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="441.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 4</text><line x1="480" y1="165" x2="480" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="519.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 5</text><line x1="558" y1="165" x2="558" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="597.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 6</text><line x1="636" y1="165" x2="636" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="675.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 7</text><line x1="714" y1="165" x2="714" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="753.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 8</text><line x1="792" y1="165" x2="792" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="831.0" y="190" class="tiny" text-anchor="middle" fill="#5f6b7a">bit 9</text><line x1="870" y1="165" x2="870" y2="450" stroke="#cbd5e1" stroke-width="1.5"/><text x="55" y="258" class="small" text-anchor="start" fill="#2563eb" font-weight="650">理想采样</text><line x1="90" y1="275" x2="870" y2="275" stroke="#2563eb" stroke-width="2"/><circle cx="129.0" cy="275" r="6" fill="#2563eb"/><circle cx="207.0" cy="275" r="6" fill="#2563eb"/><circle cx="285.0" cy="275" r="6" fill="#2563eb"/><circle cx="363.0" cy="275" r="6" fill="#2563eb"/><circle cx="441.0" cy="275" r="6" fill="#2563eb"/><circle cx="519.0" cy="275" r="6" fill="#2563eb"/><circle cx="597.0" cy="275" r="6" fill="#2563eb"/><circle cx="675.0" cy="275" r="6" fill="#2563eb"/><circle cx="753.0" cy="275" r="6" fill="#2563eb"/><circle cx="831.0" cy="275" r="6" fill="#2563eb"/><text x="55" y="350" class="small" text-anchor="start" fill="#c2413c" font-weight="650">接收时钟偏慢</text><line x1="90" y1="370" x2="870" y2="370" stroke="#c2413c" stroke-width="2"/><circle cx="132.0" cy="370" r="6" fill="#c2413c"/><line x1="129.0" y1="330" x2="132.0" y2="330" stroke="#c2413c" stroke-width="1.5"  marker-end="url(#arrow-c2413c)"/><text x="130.5" y="322.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">+3</text><circle cx="213.0" cy="370" r="6" fill="#c2413c"/><circle cx="294.0" cy="370" r="6" fill="#c2413c"/><circle cx="375.0" cy="370" r="6" fill="#c2413c"/><circle cx="456.0" cy="370" r="6" fill="#c2413c"/><line x1="441.0" y1="330" x2="456.0" y2="330" stroke="#c2413c" stroke-width="1.5"  marker-end="url(#arrow-c2413c)"/><text x="448.5" y="322.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">+15</text><circle cx="537.0" cy="370" r="6" fill="#c2413c"/><circle cx="618.0" cy="370" r="6" fill="#c2413c"/><circle cx="699.0" cy="370" r="6" fill="#c2413c"/><circle cx="780.0" cy="370" r="6" fill="#c2413c"/><circle cx="861.0" cy="370" r="6" fill="#c2413c"/><line x1="831.0" y1="330" x2="861.0" y2="330" stroke="#c2413c" stroke-width="1.5"  marker-end="url(#arrow-c2413c)"/><text x="846.0" y="322.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">+30</text><text x="480" y="485" class="label" text-anchor="middle" fill="#c2413c" font-weight="650">每经过一位，采样时刻再偏移 ΔT；帧末最接近相邻位边界</text><rect x="160" y="525" width="285" height="34" rx="17.0" fill="#fff7ed" stroke="#b96800" stroke-width="1.5" /><text x="302.5" y="548.0" class="small" text-anchor="middle" fill="#b96800" font-weight="650">起始边沿只同步这一帧</text><rect x="515" y="525" width="285" height="34" rx="17.0" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" /><text x="657.5" y="548.0" class="small" text-anchor="middle" fill="#0891b2" font-weight="650">容差取决于帧长与接收算法</text>
