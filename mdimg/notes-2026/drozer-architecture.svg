    </style></defs>
  <rect width="960" height="615" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">Drozer 的调用链与身份边界</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">Console 经 ADB 转发连接 Agent，实际 Android IPC 请求由 Agent 的 UID 发出</text>
  <rect x="45" y="145" width="245" height="205" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="45" y="145" width="7" height="205" rx="3.5" fill="#2563eb"/><text x="69" y="179" class="box-title" text-anchor="start" fill="#172033" font-size="18">电脑：Drozer Console</text><text x="69" y="209" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="69" dy="0">模块与交互界面</tspan><tspan x="69" dy="1.35em">localhost:31415</tspan><tspan x="69" dy="1.35em">记录命令与版本</tspan></text><rect x="365" y="125" width="230" height="245" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="365" y="125" width="7" height="245" rx="3.5" fill="#7c3aed"/><text x="389" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">手机：Drozer Agent</text><text x="389" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="389" dy="0">Embedded Server</tspan><tspan x="389" dy="1.35em">Agent UID / 权限</tspan><tspan x="389" dy="1.35em">发起 Intent、Binder</tspan><tspan x="389" dy="1.35em">ContentResolver 调用</tspan></text><rect x="695" y="145" width="220" height="205" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="695" y="145" width="7" height="205" rx="3.5" fill="#16845b"/><text x="719" y="179" class="box-title" text-anchor="start" fill="#172033" font-size="20">目标 App</text><text x="719" y="209" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="719" dy="0">独立 UID</tspan><tspan x="719" dy="1.35em">导出组件</tspan><tspan x="719" dy="1.35em">组件权限 / 业务检查</tspan></text><line x1="290" y1="215" x2="365" y2="215" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="327.5" y="205.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">adb forward</text><line x1="595" y1="245" x2="695" y2="245" stroke="#7c3aed" stroke-width="3"  marker-end="url(#arrow-7c3aed)"/><text x="645.0" y="235.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">Android IPC</text><text x="480" y="408" class="label" text-anchor="middle" fill="#c2413c" font-weight="650">调用身份 = Agent，而不是电脑用户、adb shell 或目标 App</text><rect x="75" y="465" width="370" height="100" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2" /><rect x="75" y="465" width="7" height="100" rx="3.5" fill="#b96800"/><text x="99" y="499" class="box-title" text-anchor="start" fill="#172033" font-size="20">先记录 Agent</text><text x="99" y="529" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="99" dy="0">UID · 已授予权限 · Agent / Console 版本</tspan></text><rect x="515" y="465" width="370" height="100" rx="14" fill="#ecfeff" stroke="#cbd5e1" stroke-width="2" /><rect x="515" y="465" width="7" height="100" rx="3.5" fill="#0891b2"/><text x="539" y="499" class="box-title" text-anchor="start" fill="#172033" font-size="20">再解释结果</text><text x="539" y="529" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="539" dy="0">系统拒绝 · 组件拒绝 · 业务层拒绝 · 操作成功</tspan></text>
</svg>
