<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">ZIP 解压要验证 canonical path 与目录前缀</title>
  <desc id="desc">getCanonicalFile 消解路径后，再用 root 路径加目录分隔符建立边界</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="680" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">ZIP 解压要验证 canonical path 与目录前缀</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">getCanonicalFile 消解路径后，再用 root 路径加目录分隔符建立边界</text>
  <rect x="45" y="135" width="190" height="150" rx="14" fill="#fff1f2" stroke="#cbd5e1" stroke-width="2" /><rect x="45" y="135" width="7" height="150" rx="3.5" fill="#c2413c"/><text x="69" y="169" class="box-title" text-anchor="start" fill="#172033" font-size="20">ZIP entry</text><text x="69" y="199" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="69" dy="0">../../files/token</tspan><tspan x="69" dy="1.35em">或 images/a.png</tspan><tspan x="69" dy="1.35em">输入不可直接拼接</tspan></text><line x1="235" y1="210" x2="320" y2="210" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="277.5" y="200.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">构造</text><rect x="320" y="135" width="265" height="150" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="320" y="135" width="7" height="150" rx="3.5" fill="#2563eb"/><text x="344" y="169" class="box-title" text-anchor="start" fill="#172033" font-size="20">取得 canonical path</text><text x="344" y="199" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="344" dy="0">new File(root, name)</tspan><tspan x="344" dy="1.35em">.getCanonicalFile()</tspan><tspan x="344" dy="1.35em">消解 .. 与符号链接</tspan></text><line x1="585" y1="210" x2="670" y2="210" stroke="#7c3aed" stroke-width="3"  marker-end="url(#arrow-7c3aed)"/><text x="627.5" y="200.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">检查</text><rect x="670" y="135" width="245" height="150" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="670" y="135" width="7" height="150" rx="3.5" fill="#7c3aed"/><text x="694" y="169" class="box-title" text-anchor="start" fill="#172033" font-size="20">带分隔符的前缀</text><text x="694" y="199" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="694" dy="0">prefix = root path</tspan><tspan x="694" dy="1.35em">+ File.separator</tspan><tspan x="694" dy="1.35em">target.startsWith(prefix)</tspan></text><text x="45" y="355" class="small" text-anchor="start" fill="#c2413c" font-weight="700">示例 1</text><rect x="130" y="338" width="260" height="34" rx="17.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.5" /><text x="260.0" y="361.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">/safe/../../files/token</text><line x1="390" y1="355" x2="550" y2="355" stroke="#c2413c" stroke-width="3"  marker-end="url(#arrow-c2413c)"/><text x="470.0" y="345.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">canonical</text><rect x="570" y="338" width="255" height="34" rx="17.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.5" /><text x="697.5" y="361.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">/files/token → REJECT</text><text x="45" y="435" class="small" text-anchor="start" fill="#16845b" font-weight="700">示例 2</text><rect x="130" y="418" width="260" height="34" rx="17.0" fill="#ecfdf5" stroke="#16845b" stroke-width="1.5" /><text x="260.0" y="441.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">/safe/images/a.png</text><line x1="390" y1="435" x2="550" y2="435" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="470.0" y="425.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">canonical</text><rect x="570" y="418" width="255" height="34" rx="17.0" fill="#ecfdf5" stroke="#16845b" stroke-width="1.5" /><text x="697.5" y="441.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">前缀 /safe/ → WRITE</text><rect x="105" y="510" width="750" height="125" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2" /><rect x="105" y="510" width="7" height="125" rx="3.5" fill="#b96800"/><text x="129" y="544" class="box-title" text-anchor="start" fill="#172033" font-size="20">还要限制写入行为</text><text x="129" y="574" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="129" dy="0">处理符号链接与并发替换 · 限制总大小和单文件大小</tspan><tspan x="129" dy="1.35em">限制覆盖策略 · 临时目录原子落盘 · 单独防范 ZIP bomb</tspan></text>
</svg>
