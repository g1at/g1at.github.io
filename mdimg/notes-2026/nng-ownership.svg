<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">NNG 消息所有权随 API 结果转移</title>
  <desc id="desc">发送成功与失败的清理责任相反；接收成功后由应用负责最终处置</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">NNG 消息所有权随 API 结果转移</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">发送成功与失败的清理责任相反；接收成功后由应用负责最终处置</text>
  <rect x="55" y="125" width="220" height="105" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="55" y="125" width="7" height="105" rx="3.5" fill="#2563eb"/><text x="79" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">应用创建消息</text><text x="79" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="79" dy="0">nng_msg_alloc</tspan><tspan x="79" dy="1.35em">当前所有者：应用</tspan></text><line x1="275" y1="178" x2="395" y2="178" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="335.0" y="168.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">nng_sendmsg</text><rect x="395" y="105" width="240" height="120" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="395" y="105" width="7" height="120" rx="3.5" fill="#16845b"/><text x="419" y="139" class="box-title" text-anchor="start" fill="#172033" font-size="20">返回 0：发送成功</text><text x="419" y="169" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="419" dy="0">所有权转给 NNG</tspan><tspan x="419" dy="1.35em">应用不可再释放或修改</tspan></text><rect x="395" y="260" width="240" height="120" rx="14" fill="#fff1f2" stroke="#cbd5e1" stroke-width="2" /><rect x="395" y="260" width="7" height="120" rx="3.5" fill="#c2413c"/><text x="419" y="294" class="box-title" text-anchor="start" fill="#172033" font-size="20">返回非 0：发送失败</text><text x="419" y="324" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="419" dy="0">所有权仍在应用</tspan><tspan x="419" dy="1.35em">应用负责重试或释放</tspan></text><line x1="330" y1="190" x2="395" y2="295" stroke="#c2413c" stroke-width="3"  marker-end="url(#arrow-c2413c)"/><text x="362.5" y="232.5" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">失败分支</text><line x1="635" y1="320" x2="805" y2="320" stroke="#c2413c" stroke-width="3"  marker-end="url(#arrow-c2413c)"/><text x="720.0" y="310.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">nng_msg_free</text><rect x="805" y="303" width="105" height="34" rx="17.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.5" /><text x="857.5" y="326.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">释放</text><line x1="55" y1="430" x2="905" y2="430" stroke="#cbd5e1" stroke-width="2"/><rect x="55" y="470" width="220" height="105" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="55" y="470" width="7" height="105" rx="3.5" fill="#7c3aed"/><text x="79" y="504" class="box-title" text-anchor="start" fill="#172033" font-size="20">nng_recvmsg</text><text x="79" y="534" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="79" dy="0">接收成功</tspan><tspan x="79" dy="1.35em">消息交给应用</tspan></text><line x1="275" y1="522" x2="420" y2="522" stroke="#7c3aed" stroke-width="3"  marker-end="url(#arrow-7c3aed)"/><text x="347.5" y="512.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">应用处理</text><rect x="420" y="470" width="220" height="105" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="420" y="470" width="7" height="105" rx="3.5" fill="#7c3aed"/><text x="444" y="504" class="box-title" text-anchor="start" fill="#172033" font-size="20">应用拥有消息</text><text x="444" y="534" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="444" dy="0">读取 / 修改</tspan><tspan x="444" dy="1.35em">选择后续动作</tspan></text><line x1="640" y1="500" x2="815" y2="480" stroke="#c2413c" stroke-width="3"  marker-end="url(#arrow-c2413c)"/><text x="727.5" y="480.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">free</text><line x1="640" y1="545" x2="815" y2="575" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="727.5" y="550.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">再次成功发送</text><text x="855" y="478" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">释放</text><text x="855" y="598" class="small" text-anchor="middle" fill="#16845b" font-weight="650">转交 NNG</text>
</svg>
