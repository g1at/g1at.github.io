<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">Linux 加固机制作用在不同阶段</title>
  <desc id="desc">从编译到运行，分别标出保护对象与触发结果</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">Linux 加固机制作用在不同阶段</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">从编译到运行，分别标出保护对象与触发结果</text>
  <rect x="50" y="125" width="155" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="50" y="125" width="7" height="112" rx="3.5" fill="#7c3aed"/><text x="74" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">源码</text><text x="74" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="74" dy="0">strcpy 等调用</tspan><tspan x="74" dy="1.35em">局部栈对象</tspan></text><line x1="212" y1="181" x2="236" y2="181" stroke="#5f6b7a" stroke-width="2"  marker-end="url(#arrow-5f6b7a)"/><rect x="245" y="125" width="155" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="245" y="125" width="7" height="112" rx="3.5" fill="#2563eb"/><text x="269" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">编译</text><text x="269" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="269" dy="0">Canary</tspan><tspan x="269" dy="1.35em">FORTIFY</tspan></text><line x1="407" y1="181" x2="431" y2="181" stroke="#5f6b7a" stroke-width="2"  marker-end="url(#arrow-5f6b7a)"/><rect x="440" y="125" width="155" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="440" y="125" width="7" height="112" rx="3.5" fill="#0891b2"/><text x="464" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">链接</text><text x="464" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="464" dy="0">PIE</tspan><tspan x="464" dy="1.35em">RELRO / NOW</tspan></text><line x1="602" y1="181" x2="626" y2="181" stroke="#5f6b7a" stroke-width="2"  marker-end="url(#arrow-5f6b7a)"/><rect x="635" y="125" width="155" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="635" y="125" width="7" height="112" rx="3.5" fill="#16845b"/><text x="659" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">装载</text><text x="659" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="659" dy="0">ASLR</tspan><tspan x="659" dy="1.35em">页权限（NX）</tspan></text><line x1="797" y1="181" x2="791" y2="181" stroke="#5f6b7a" stroke-width="2"  marker-end="url(#arrow-5f6b7a)"/><rect x="800" y="125" width="140" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="800" y="125" width="7" height="112" rx="3.5" fill="#c2413c"/><text x="824" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">运行</text><text x="824" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="824" dy="0">检查失败终止</tspan><tspan x="824" dy="1.35em">权限违例</tspan></text><text x="52" y="280" class="box-title" text-anchor="start" fill="#172033">保护对象不同，组合使用才有意义</text><rect x="52" y="310" width="135" height="34" rx="17.0" fill="#ffffff" stroke="#16845b" stroke-width="1.5" /><text x="119.5" y="333.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">NX</text><text x="225" y="335" class="label" text-anchor="start" fill="#172033" font-weight="650">内存页</text><line x1="375" y1="329" x2="465" y2="329" stroke="#16845b" stroke-width="2"  marker-end="url(#arrow-16845b)"/><text x="500" y="335" class="label" text-anchor="start" fill="#5f6b7a">阻止数据页直接执行</text><rect x="52" y="375" width="135" height="34" rx="17.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" /><text x="119.5" y="398.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">Canary</text><text x="225" y="400" class="label" text-anchor="start" fill="#172033" font-weight="650">函数返回路径</text><line x1="375" y1="394" x2="465" y2="394" stroke="#2563eb" stroke-width="2"  marker-end="url(#arrow-2563eb)"/><text x="500" y="400" class="label" text-anchor="start" fill="#5f6b7a">检测覆盖 guard 的栈写越界</text><rect x="52" y="440" width="135" height="34" rx="17.0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" /><text x="119.5" y="463.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">PIE + ASLR</text><text x="225" y="465" class="label" text-anchor="start" fill="#172033" font-weight="650">装载地址</text><line x1="375" y1="459" x2="465" y2="459" stroke="#7c3aed" stroke-width="2"  marker-end="url(#arrow-7c3aed)"/><text x="500" y="465" class="label" text-anchor="start" fill="#5f6b7a">让主程序与映射地址每次变化</text><rect x="52" y="505" width="135" height="34" rx="17.0" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" /><text x="119.5" y="528.0" class="small" text-anchor="middle" fill="#0891b2" font-weight="650">RELRO</text><text x="225" y="530" class="label" text-anchor="start" fill="#172033" font-weight="650">重定位区域</text><line x1="375" y1="524" x2="465" y2="524" stroke="#0891b2" stroke-width="2"  marker-end="url(#arrow-0891b2)"/><text x="500" y="530" class="label" text-anchor="start" fill="#5f6b7a">重定位后收紧写权限</text><rect x="52" y="570" width="135" height="34" rx="17.0" fill="#ffffff" stroke="#b96800" stroke-width="1.5" /><text x="119.5" y="593.0" class="small" text-anchor="middle" fill="#b96800" font-weight="650">FORTIFY</text><text x="225" y="595" class="label" text-anchor="start" fill="#172033" font-weight="650">已知对象边界</text><line x1="375" y1="589" x2="465" y2="589" stroke="#b96800" stroke-width="2"  marker-end="url(#arrow-b96800)"/><text x="500" y="595" class="label" text-anchor="start" fill="#5f6b7a">在可推导长度时替换为检查版本</text>
</svg>
