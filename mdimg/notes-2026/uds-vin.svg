  <text x="48" y="52" class="title" text-anchor="start">UDS 长数据读取的 ISO-TP 往返</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">ECU 发送 FF 后等待 Tester 的 FC，再按序号发送两个 CF</text>
  <rect x="60" y="105" width="160" height="34" rx="17.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="140.0" y="128.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">Tester · 0x7E0</text><rect x="740" y="105" width="160" height="34" rx="17.0" fill="#ecfdf5" stroke="#16845b" stroke-width="1.5" /><text x="820.0" y="128.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">ECU · 0x7E8</text><line x1="140" y1="145" x2="140" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/><line x1="820" y1="145" x2="820" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/><line x1="155" y1="180" x2="805" y2="180" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="480.0" y="168.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">03 22 F1 90</text><text x="480" y="207" class="tiny" text-anchor="middle" fill="#5f6b7a">ReadDataByIdentifier(F190)</text><line x1="805" y1="265" x2="155" y2="265" stroke="#7c3aed" stroke-width="3"  marker-end="url(#arrow-7c3aed)"/><text x="480.0" y="253.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">10 14 62 F1 90 4C 54 45</text><text x="480" y="292" class="tiny" text-anchor="middle" fill="#5f6b7a">FF：总负载 0x014 = 20 字节</text><line x1="155" y1="350" x2="805" y2="350" stroke="#b96800" stroke-width="3"  marker-end="url(#arrow-b96800)"/><text x="480.0" y="338.0" class="small" text-anchor="middle" fill="#b96800" font-weight="650">30 00 00</text><text x="480" y="377" class="tiny" text-anchor="middle" fill="#5f6b7a">FC：CTS，BS=0，STmin=0</text><line x1="805" y1="435" x2="155" y2="435" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="480.0" y="423.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">21 53 54 31 32 33 34 35</text><text x="480" y="462" class="tiny" text-anchor="middle" fill="#5f6b7a">CF：SN=1</text><line x1="805" y1="520" x2="155" y2="520" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="480.0" y="508.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">22 36 37 38 39 30 31 32</text><text x="480" y="547" class="tiny" text-anchor="middle" fill="#5f6b7a">CF：SN=2</text><rect x="175" y="605" width="610" height="90" rx="14" fill="#ecfeff" stroke="#cbd5e1" stroke-width="2" /><rect x="175" y="605" width="7" height="90" rx="3.5" fill="#0891b2"/><text x="199" y="639" class="box-title" text-anchor="start" fill="#172033" font-size="20">重组后的 UDS 负载</text><text x="199" y="669" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="199" dy="0">62 F1 90 | LTEST123456789012</tspan><tspan x="199" dy="1.35em">3 字节响应头 + 17 字节人工标识，共 20 字节</tspan></text>
