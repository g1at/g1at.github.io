<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">从 OBD 接口到可读物理量的协议栈</title>
  <desc id="desc">连接器、CAN、ISO-TP、诊断服务和数据公式共同构成一次读取</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">从 OBD 接口到可读物理量的协议栈</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">连接器、CAN、ISO-TP、诊断服务和数据公式共同构成一次读取</text>
  <rect x="40" y="140" width="155" height="205" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="40" y="140" width="7" height="205" rx="3.5" fill="#5f6b7a"/><text x="64" y="174" class="box-title" text-anchor="start" fill="#172033" font-size="18">DLC 连接器</text><text x="64" y="204" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="64" dy="0">针脚 / 电气层</tspan><tspan x="64" dy="1.35em">6 = CAN-H</tspan><tspan x="64" dy="1.35em">14 = CAN-L</tspan></text><line x1="195" y1="242" x2="217" y2="242" stroke="#5f6b7a" stroke-width="2"  marker-end="url(#arrow-5f6b7a)"/><rect x="225" y="140" width="155" height="205" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="225" y="140" width="7" height="205" rx="3.5" fill="#2563eb"/><text x="249" y="174" class="box-title" text-anchor="start" fill="#172033" font-size="18">CAN 帧</text><text x="249" y="204" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="249" dy="0">ID 0x7DF</tspan><tspan x="249" dy="1.35em">ID 0x7E8</tspan><tspan x="249" dy="1.35em">经典 CAN：8 B</tspan></text><line x1="380" y1="242" x2="402" y2="242" stroke="#2563eb" stroke-width="2"  marker-end="url(#arrow-2563eb)"/><rect x="410" y="140" width="155" height="205" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="410" y="140" width="7" height="205" rx="3.5" fill="#0891b2"/><text x="434" y="174" class="box-title" text-anchor="start" fill="#172033" font-size="18">ISO-TP</text><text x="434" y="204" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="434" dy="0">SF · FF</tspan><tspan x="434" dy="1.35em">CF · FC</tspan><tspan x="434" dy="1.35em">重组诊断负载</tspan></text><line x1="565" y1="242" x2="587" y2="242" stroke="#0891b2" stroke-width="2"  marker-end="url(#arrow-0891b2)"/><rect x="595" y="140" width="155" height="205" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="595" y="140" width="7" height="205" rx="3.5" fill="#7c3aed"/><text x="619" y="174" class="box-title" text-anchor="start" fill="#172033" font-size="18">OBD 服务</text><text x="619" y="204" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="619" dy="0">Mode 01</tspan><tspan x="619" dy="1.35em">PID 0C</tspan><tspan x="619" dy="1.35em">服务语义</tspan></text><line x1="750" y1="242" x2="772" y2="242" stroke="#7c3aed" stroke-width="2"  marker-end="url(#arrow-7c3aed)"/><rect x="780" y="140" width="155" height="205" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="780" y="140" width="7" height="205" rx="3.5" fill="#16845b"/><text x="804" y="174" class="box-title" text-anchor="start" fill="#172033" font-size="18">物理量</text><text x="804" y="204" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="804" dy="0">A = 0x1A</tspan><tspan x="804" dy="1.35em">B = 0xF8</tspan><tspan x="804" dy="1.35em">1726 rpm</tspan></text><text x="480" y="395" class="box-title" text-anchor="middle" fill="#172033">每一层回答不同问题</text><rect x="25" y="430" width="140" height="34" rx="17.0" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.5" /><text x="95.0" y="453.0" class="small" text-anchor="middle" fill="#5f6b7a" font-weight="650">接哪几根线？</text><rect x="205" y="430" width="140" height="34" rx="17.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" /><text x="275.0" y="453.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">哪台 ECU？</text><rect x="390" y="430" width="140" height="34" rx="17.0" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" /><text x="460.0" y="453.0" class="small" text-anchor="middle" fill="#0891b2" font-weight="650">如何跨帧？</text><rect x="575" y="430" width="140" height="34" rx="17.0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" /><text x="645.0" y="453.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">请求什么数据？</text><rect x="760" y="430" width="140" height="34" rx="17.0" fill="#ffffff" stroke="#16845b" stroke-width="1.5" /><text x="830.0" y="453.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">怎样换算？</text><rect x="130" y="510" width="700" height="90" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2" /><rect x="130" y="510" width="7" height="90" rx="3.5" fill="#b96800"/><text x="154" y="544" class="box-title" text-anchor="start" fill="#172033" font-size="20">不要混用描述层次</text><text x="154" y="574" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="154" dy="0">DBC 可描述某些 CAN 信号；诊断还需要服务语义、ISO-TP 重组与会话条件。</tspan></text>
</svg>
