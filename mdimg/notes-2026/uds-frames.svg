  <rect width="960" height="680" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">ISO-TP 四种帧的 N_PCI 字段</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">在经典 CAN 正常寻址下，首字节或前两字节描述分段与流控</text>
  <rect x="45" y="130" width="72" height="40" rx="20.0" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" /><text x="81.0" y="156.0" class="small" text-anchor="middle" fill="#0891b2" font-weight="650">SF</text><rect x="140" y="120" width="77.5" height="60" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" /><text x="178.75" y="156" class="mono" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">0 | LEN</text><rect x="217.5" y="120" width="542.5" height="60" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="488.75" y="156" class="small" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">DATA × 7</text><text x="790" y="147" class="tiny" text-anchor="start" fill="#5f6b7a"><tspan x="790" dy="0">短负载</tspan><tspan x="790" dy="1.35em">一次装完</tspan></text><rect x="45" y="230" width="72" height="40" rx="20.0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" /><text x="81.0" y="256.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">FF</text><rect x="140" y="220" width="100.75" height="60" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" /><text x="190.375" y="256" class="mono" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">1 | L[11:8]</text><rect x="240.75" y="220" width="77.5" height="60" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" /><text x="279.5" y="256" class="mono" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">L[7:0]</text><rect x="318.25" y="220" width="441.75" height="60" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="539.125" y="256" class="small" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">DATA × 6</text><text x="790" y="247" class="tiny" text-anchor="start" fill="#5f6b7a"><tspan x="790" dy="0">声明总长</tspan><tspan x="790" dy="1.35em">并带首段数据</tspan></text><rect x="45" y="330" width="72" height="40" rx="20.0" fill="#ffffff" stroke="#16845b" stroke-width="1.5" /><text x="81.0" y="356.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">CF</text><rect x="140" y="320" width="77.5" height="60" rx="3" fill="#ecfdf5" stroke="#16845b" stroke-width="1.5" /><text x="178.75" y="356" class="mono" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">2 | SN</text><rect x="217.5" y="320" width="542.5" height="60" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="488.75" y="356" class="small" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">DATA × 7</text><text x="790" y="347" class="tiny" text-anchor="start" fill="#5f6b7a"><tspan x="790" dy="0">SN 逐帧递增</tspan><tspan x="790" dy="1.35em">（低 4 bit）</tspan></text><rect x="45" y="430" width="72" height="40" rx="20.0" fill="#ffffff" stroke="#b96800" stroke-width="1.5" /><text x="81.0" y="456.0" class="small" text-anchor="middle" fill="#b96800" font-weight="650">FC</text><rect x="140" y="420" width="77.5" height="60" rx="3" fill="#fff7ed" stroke="#b96800" stroke-width="1.5" /><text x="178.75" y="456" class="mono" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">3 | FS</text><rect x="217.5" y="420" width="77.5" height="60" rx="3" fill="#fff7ed" stroke="#b96800" stroke-width="1.5" /><text x="256.25" y="456" class="mono" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">BS</text><rect x="295.0" y="420" width="77.5" height="60" rx="3" fill="#fff7ed" stroke="#b96800" stroke-width="1.5" /><text x="333.75" y="456" class="mono" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">STmin</text><rect x="372.5" y="420" width="387.5" height="60" rx="3" fill="#f8fafc" stroke="#5f6b7a" stroke-width="1.5" /><text x="566.25" y="456" class="small" text-anchor="middle" fill="#172033" font-weight="650" font-size="15">padding × 5</text><text x="790" y="447" class="tiny" text-anchor="start" fill="#5f6b7a"><tspan x="790" dy="0">接收方控制</tspan><tspan x="790" dy="1.35em">后续发送节奏</tspan></text><text x="140" y="520" class="small" text-anchor="start" fill="#172033" font-weight="650">N_PCI 高半字节</text><line x1="270" y1="515" x2="375" y2="515" stroke="#7c3aed" stroke-width="2"  marker-end="url(#arrow-7c3aed)"/><text x="322.5" y="505.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">帧类型</text><text x="420" y="520" class="small" text-anchor="start" fill="#5f6b7a">其余位携带长度、序号或流控参数</text><rect x="115" y="555" width="730" height="86" rx="14" fill="#fff1f2" stroke="#cbd5e1" stroke-width="2" /><rect x="115" y="555" width="7" height="86" rx="3.5" fill="#c2413c"/><text x="139" y="589" class="box-title" text-anchor="start" fill="#172033" font-size="20">图示范围</text><text x="139" y="619" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="139" dy="0">经典 CAN、正常寻址、每帧 8 字节；扩展寻址与 CAN FD 的可用负载不同。</tspan></text>
