  <rect width="960" height="655" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">OBD Mode 01 PID 0C 转速响应拆解</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">先确认响应服务与 PID，再把两个数据字节 A、B 代入标准公式</text>
  <text x="55" y="130" class="box-title" text-anchor="start" fill="#2563eb">请求 · CAN ID 0x7DF</text><rect x="55" y="155" width="130" height="80" rx="5" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" /><text x="120.0" y="184" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">02</text><line x1="55" y1="199" x2="185" y2="199" stroke="#0891b2" stroke-width="1"/><text x="120.0" y="223" class="tiny" text-anchor="middle" fill="#5f6b7a">长度</text><rect x="190" y="155" width="130" height="80" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /><text x="255.0" y="184" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">01</text><line x1="190" y1="199" x2="320" y2="199" stroke="#2563eb" stroke-width="1"/><text x="255.0" y="223" class="tiny" text-anchor="middle" fill="#5f6b7a">Mode</text><rect x="325" y="155" width="130" height="80" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" /><text x="390.0" y="184" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">0C</text><line x1="325" y1="199" x2="455" y2="199" stroke="#7c3aed" stroke-width="1"/><text x="390.0" y="223" class="tiny" text-anchor="middle" fill="#5f6b7a">PID RPM</text><text x="505" y="198" class="mono" text-anchor="start" fill="#5f6b7a" font-size="20">00 00 00 00 00</text><text x="505" y="230" class="tiny" text-anchor="start" fill="#5f6b7a">经典 CAN 的填充字节</text><line x1="480" y1="275" x2="480" y2="335" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="480.0" y="295.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">ECU 响应</text><text x="55" y="370" class="box-title" text-anchor="start" fill="#16845b">响应 · CAN ID 0x7E8</text><rect x="55" y="395" width="130" height="80" rx="5" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" /><text x="120.0" y="424" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">04</text><line x1="55" y1="439" x2="185" y2="439" stroke="#0891b2" stroke-width="1"/><text x="120.0" y="463" class="tiny" text-anchor="middle" fill="#5f6b7a">长度</text><rect x="190" y="395" width="130" height="80" rx="5" fill="#ecfdf5" stroke="#16845b" stroke-width="1.6" /><text x="255.0" y="424" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">41</text><line x1="190" y1="439" x2="320" y2="439" stroke="#16845b" stroke-width="1"/><text x="255.0" y="463" class="tiny" text-anchor="middle" fill="#5f6b7a">01 + 0x40</text><rect x="325" y="395" width="130" height="80" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" /><text x="390.0" y="424" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">0C</text><line x1="325" y1="439" x2="455" y2="439" stroke="#7c3aed" stroke-width="1"/><text x="390.0" y="463" class="tiny" text-anchor="middle" fill="#5f6b7a">PID</text><rect x="460" y="395" width="130" height="80" rx="5" fill="#fff7ed" stroke="#b96800" stroke-width="1.6" /><text x="525.0" y="424" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">1A</text><line x1="460" y1="439" x2="590" y2="439" stroke="#b96800" stroke-width="1"/><text x="525.0" y="463" class="tiny" text-anchor="middle" fill="#5f6b7a">A</text><rect x="595" y="395" width="130" height="80" rx="5" fill="#fff7ed" stroke="#b96800" stroke-width="1.6" /><text x="660.0" y="424" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">F8</text><line x1="595" y1="439" x2="725" y2="439" stroke="#b96800" stroke-width="1"/><text x="660.0" y="463" class="tiny" text-anchor="middle" fill="#5f6b7a">B</text><rect x="95" y="520" width="770" height="96" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2" /><rect x="95" y="520" width="7" height="96" rx="3.5" fill="#b96800"/><text x="119" y="554" class="box-title" text-anchor="start" fill="#172033" font-size="20">转速公式</text><text x="119" y="584" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="119" dy="0">RPM = (A × 256 + B) / 4 = (0x1A × 256 + 0xF8) / 4 = 1726 rpm</tspan></text>
</svg>
