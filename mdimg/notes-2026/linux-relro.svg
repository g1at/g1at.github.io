<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
  <title id="title">RELRO 把可写重定位窗口限制在装载阶段</title>
  <desc id="desc">Partial 与 Full RELRO 的关键差异是动态符号是否在启动时完成解析</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="610" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">RELRO 把可写重定位窗口限制在装载阶段</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">Partial 与 Full RELRO 的关键差异是动态符号是否在启动时完成解析</text>
  <circle cx="90" cy="180" r="10" fill="#2563eb"/><text x="90" y="145" class="label" text-anchor="middle" fill="#172033" font-weight="650">映射 ELF</text><circle cx="300" cy="180" r="10" fill="#2563eb"/><text x="300" y="145" class="label" text-anchor="middle" fill="#172033" font-weight="650">执行重定位</text><circle cx="520" cy="180" r="10" fill="#2563eb"/><text x="520" y="145" class="label" text-anchor="middle" fill="#172033" font-weight="650">收紧权限</text><circle cx="740" cy="180" r="10" fill="#2563eb"/><text x="740" y="145" class="label" text-anchor="middle" fill="#172033" font-weight="650">进入 main</text><line x1="90" y1="180" x2="840" y2="180" stroke="#cbd5e1" stroke-width="5"/><circle cx="90" cy="180" r="10" fill="#2563eb"/><circle cx="300" cy="180" r="10" fill="#2563eb"/><circle cx="520" cy="180" r="10" fill="#2563eb"/><circle cx="740" cy="180" r="10" fill="#2563eb"/><rect x="60" y="235" width="840" height="118" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2" /><rect x="60" y="235" width="7" height="118" rx="3.5" fill="#b96800"/><text x="84" y="269" class="box-title" text-anchor="start" fill="#172033" font-size="20">Partial RELRO</text><text x="84" y="299" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="84" dy="0">PT_GNU_RELRO 区域在重定位后变为只读</tspan><tspan x="84" dy="1.35em">未配合 -z now 时，PLT 相关符号仍可按需解析（lazy binding）</tspan></text><rect x="650" y="275" width="210" height="34" rx="17.0" fill="#ffffff" stroke="#b96800" stroke-width="1.5" /><text x="755.0" y="298.0" class="small" text-anchor="middle" fill="#b96800" font-weight="650">部分写面仍存在</text><rect x="60" y="385" width="840" height="118" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="60" y="385" width="7" height="118" rx="3.5" fill="#16845b"/><text x="84" y="419" class="box-title" text-anchor="start" fill="#172033" font-size="20">Full RELRO = -z relro + -z now</text><text x="84" y="449" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="84" dy="0">装载阶段完成动态符号解析</tspan><tspan x="84" dy="1.35em">随后把相应重定位区域设为只读，再把控制权交给程序</tspan></text><rect x="650" y="425" width="210" height="34" rx="17.0" fill="#ffffff" stroke="#16845b" stroke-width="1.5" /><text x="755.0" y="448.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">运行期不可改写</text><line x1="275" y1="540" x2="680" y2="540" stroke="#0891b2" stroke-width="4"  marker-end="url(#arrow-0891b2)"/><text x="477.5" y="530.0" class="small" text-anchor="middle" fill="#0891b2" font-weight="650">权限由 RW 收紧为 R</text><rect x="115" y="523" width="125" height="34" rx="17.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.5" /><text x="177.5" y="546.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">RW</text><rect x="720" y="523" width="125" height="34" rx="17.0" fill="#ecfdf5" stroke="#16845b" stroke-width="1.5" /><text x="782.5" y="546.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">R--</text>
</svg>
