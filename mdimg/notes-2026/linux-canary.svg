<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
  <title id="title">栈 Canary 检查返回路径上的连续覆盖</title>
  <desc id="desc">常见 x86-64 栈布局示意；实际偏移由编译器和优化决定</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="630" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">栈 Canary 检查返回路径上的连续覆盖</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">常见 x86-64 栈布局示意；实际偏移由编译器和优化决定</text>
  <rect x="340" y="125" width="290" height="66" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><text x="485.0" y="165.0" class="label" text-anchor="middle" fill="#172033">函数参数 / 调用者栈帧</text><rect x="340" y="191" width="290" height="66" rx="3" fill="#fff1f2" stroke="#c2413c" stroke-width="2" /><text x="485.0" y="231.0" class="label" text-anchor="middle" fill="#172033">返回地址</text><rect x="340" y="257" width="290" height="66" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><text x="485.0" y="297.0" class="label" text-anchor="middle" fill="#172033">保存的帧指针</text><rect x="340" y="323" width="290" height="66" rx="3" fill="#fff7ed" stroke="#b96800" stroke-width="2" /><text x="485.0" y="363.0" class="label" text-anchor="middle" fill="#172033" font-weight="650">Canary / guard</text><rect x="340" y="389" width="290" height="64" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><text x="485.0" y="428.0" class="label" text-anchor="middle" fill="#172033">对齐 / 其他局部变量</text><rect x="340" y="453" width="290" height="104" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="485.0" y="512.0" class="label" text-anchor="middle" fill="#172033">局部缓冲区 char buf[32]</text><line x1="690" y1="548" x2="690" y2="208" stroke="#c2413c" stroke-width="4"  marker-end="url(#arrow-c2413c)"/><text x="690.0" y="456.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">连续越界写方向</text><text x="705" y="350" class="small" text-anchor="start" fill="#c2413c"><tspan x="705" dy="0">若写入经过 Canary</tspan><tspan x="705" dy="1.35em">再碰到返回地址，</tspan><tspan x="705" dy="1.35em">函数退出检查会发现变化</tspan></text><line x1="315" y1="540" x2="315" y2="170" stroke="#5f6b7a" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow-5f6b7a)"/><text x="315" y="585" class="tiny" text-anchor="middle" fill="#5f6b7a" font-weight="650">栈增长</text><text x="650" y="145" class="small" text-anchor="start" fill="#5f6b7a">高地址</text><text x="650" y="585" class="small" text-anchor="start" fill="#5f6b7a">低地址</text><rect x="52" y="145" width="225" height="132" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="52" y="145" width="7" height="132" rx="3.5" fill="#7c3aed"/><text x="76" y="179" class="box-title" text-anchor="start" fill="#172033" font-size="20">边界</text><text x="76" y="209" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="76" dy="0">布局会被 ABI、优化</tspan><tspan x="76" dy="1.35em">与函数结构改变</tspan><tspan x="76" dy="1.35em">图中偏移仅为示意</tspan></text><rect x="52" y="320" width="225" height="132" rx="14" fill="#ecfeff" stroke="#cbd5e1" stroke-width="2" /><rect x="52" y="320" width="7" height="132" rx="3.5" fill="#0891b2"/><text x="76" y="354" class="box-title" text-anchor="start" fill="#172033" font-size="20">未覆盖的情况</text><text x="76" y="384" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="76" dy="0">堆越界、非连续写</tspan><tspan x="76" dy="1.35em">未经过 guard 的覆盖</tspan><tspan x="76" dy="1.35em">仍需其他防护</tspan></text>
</svg>
