<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">MQTT QoS 1 与 QoS 2 的确认时序</title>
  <desc id="desc">Packet Identifier 把确认消息与对应的 PUBLISH 关联起来</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">MQTT QoS 1 与 QoS 2 的确认时序</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">Packet Identifier 把确认消息与对应的 PUBLISH 关联起来</text>
  <rect x="105" y="115" width="150" height="34" rx="17.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" /><text x="180.0" y="138.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">发送方</text><line x1="180" y1="154" x2="180" y2="600" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/><rect x="705" y="115" width="150" height="34" rx="17.0" fill="#ffffff" stroke="#16845b" stroke-width="1.5" /><text x="780.0" y="138.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">接收方</text><line x1="780" y1="154" x2="780" y2="600" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/><text x="55" y="205" class="box-title" text-anchor="start" fill="#2563eb">QoS 1</text><line x1="195" y1="205" x2="765" y2="205" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="480.0" y="195.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">PUBLISH  [Packet ID = 7]</text><line x1="765" y1="265" x2="195" y2="265" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="480.0" y="255.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">PUBACK   [Packet ID = 7]</text><text x="480" y="304" class="small" text-anchor="middle" fill="#5f6b7a">超时未确认可重发 PUBLISH（DUP=1），接收端因此需要处理重复</text><line x1="55" y1="335" x2="905" y2="335" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="390" class="box-title" text-anchor="start" fill="#7c3aed">QoS 2</text><line x1="195" y1="400" x2="765" y2="400" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="480.0" y="390.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">PUBLISH   [Packet ID = 9]</text><line x1="765" y1="455" x2="195" y2="455" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="480.0" y="445.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">PUBREC   [Packet ID = 9]</text><line x1="195" y1="510" x2="765" y2="510" stroke="#7c3aed" stroke-width="3"  marker-end="url(#arrow-7c3aed)"/><text x="480.0" y="500.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">PUBREL   [Packet ID = 9]</text><line x1="765" y1="565" x2="195" y2="565" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="480.0" y="555.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">PUBCOMP   [Packet ID = 9]</text><text x="480" y="626" class="small" text-anchor="middle" fill="#5f6b7a">一段链路的交换；Broker 向订阅者转发时会独立协商 QoS</text>
</svg>
