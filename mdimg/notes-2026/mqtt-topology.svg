<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
  <title id="title">MQTT 发布订阅拓扑</title>
  <desc id="desc">发布者与订阅者解耦，但都依赖 Broker 完成连接、鉴权与转发</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="570" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">MQTT 发布订阅拓扑</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">发布者与订阅者解耦，但都依赖 Broker 完成连接、鉴权与转发</text>
  <rect x="55" y="125" width="225" height="108" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="55" y="125" width="7" height="108" rx="3.5" fill="#2563eb"/><text x="79" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">温度传感器</text><text x="79" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="79" dy="0">publish</tspan><tspan x="79" dy="1.35em">lab/room1/temp</tspan></text><rect x="55" y="305" width="225" height="108" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="55" y="305" width="7" height="108" rx="3.5" fill="#2563eb"/><text x="79" y="339" class="box-title" text-anchor="start" fill="#172033" font-size="20">门磁传感器</text><text x="79" y="369" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="79" dy="0">publish</tspan><tspan x="79" dy="1.35em">lab/door/state</tspan></text><rect x="365" y="190" width="230" height="190" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="365" y="190" width="7" height="190" rx="3.5" fill="#7c3aed"/><text x="389" y="224" class="box-title" text-anchor="start" fill="#172033" font-size="20">MQTT Broker</text><text x="389" y="254" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="389" dy="0">连接认证</tspan><tspan x="389" dy="1.35em">Topic ACL</tspan><tspan x="389" dy="1.35em">订阅表 / 会话</tspan><tspan x="389" dy="1.35em">保留消息</tspan></text><rect x="680" y="125" width="225" height="108" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="680" y="125" width="7" height="108" rx="3.5" fill="#16845b"/><text x="704" y="159" class="box-title" text-anchor="start" fill="#172033" font-size="20">监控面板</text><text x="704" y="189" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="704" dy="0">subscribe</tspan><tspan x="704" dy="1.35em">lab/+/temp</tspan></text><rect x="680" y="305" width="225" height="108" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="680" y="305" width="7" height="108" rx="3.5" fill="#16845b"/><text x="704" y="339" class="box-title" text-anchor="start" fill="#172033" font-size="20">告警服务</text><text x="704" y="369" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="704" dy="0">subscribe</tspan><tspan x="704" dy="1.35em">lab/#</tspan></text><line x1="280" y1="180" x2="365" y2="240" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="322.5" y="200.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">PUBLISH</text><line x1="280" y1="360" x2="365" y2="325" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="322.5" y="332.5" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">PUBLISH</text><line x1="595" y1="240" x2="680" y2="180" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="637.5" y="200.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">转发</text><line x1="595" y1="325" x2="680" y2="360" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="637.5" y="332.5" class="small" text-anchor="middle" fill="#16845b" font-weight="650">转发</text><text x="480" y="450" class="label" text-anchor="middle" fill="#5f6b7a">每个客户端都与 Broker 建立自己的 TCP/TLS 连接</text><rect x="205" y="485" width="210" height="34" rx="17.0" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" /><text x="310.0" y="508.0" class="small" text-anchor="middle" fill="#0891b2" font-weight="650">发布者不知道订阅者地址</text><rect x="445" y="485" width="310" height="34" rx="17.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" /><text x="600.0" y="508.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">Broker 依据主题过滤器匹配</text>
</svg>
