    </style></defs>
  <rect width="960" height="630" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">从 Drozer 模块输出建立可复核证据链</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">扫描结果用于定位入口，漏洞结论来自受控调用、对照与修复复测</text>
  <circle cx="120" cy="145" r="28" fill="#2563eb"/><text x="120" y="153" class="box-title" text-anchor="middle" fill="#ffffff">1</text><rect x="45" y="195" width="150" height="145" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="45" y="195" width="7" height="145" rx="3.5" fill="#2563eb"/><text x="69" y="229" class="box-title" text-anchor="start" fill="#172033" font-size="18">枚举入口</text><text x="69" y="259" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="69" dy="0">组件 / URI</tspan><tspan x="69" dy="1.35em">权限与参数</tspan></text><line x1="195" y1="268" x2="217" y2="268" stroke="#5f6b7a" stroke-width="2"  marker-end="url(#arrow-5f6b7a)"/><circle cx="300" cy="145" r="28" fill="#0891b2"/><text x="300" y="153" class="box-title" text-anchor="middle" fill="#ffffff">2</text><rect x="225" y="195" width="150" height="145" rx="14" fill="#ecfeff" stroke="#cbd5e1" stroke-width="2" /><rect x="225" y="195" width="7" height="145" rx="3.5" fill="#0891b2"/><text x="249" y="229" class="box-title" text-anchor="start" fill="#172033" font-size="18">最小调用</text><text x="249" y="259" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="249" dy="0">固定前置状态</tspan><tspan x="249" dy="1.35em">非敏感 marker</tspan></text><line x1="375" y1="268" x2="397" y2="268" stroke="#5f6b7a" stroke-width="2"  marker-end="url(#arrow-5f6b7a)"/><circle cx="480" cy="145" r="28" fill="#7c3aed"/><text x="480" y="153" class="box-title" text-anchor="middle" fill="#ffffff">3</text><rect x="405" y="195" width="150" height="145" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="405" y="195" width="7" height="145" rx="3.5" fill="#7c3aed"/><text x="429" y="229" class="box-title" text-anchor="start" fill="#172033" font-size="18">结果对照</text><text x="429" y="259" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="429" dy="0">授权 / 未授权</tspan><tspan x="429" dy="1.35em">返回与状态变化</tspan></text><line x1="555" y1="268" x2="577" y2="268" stroke="#5f6b7a" stroke-width="2"  marker-end="url(#arrow-5f6b7a)"/><circle cx="660" cy="145" r="28" fill="#b96800"/><text x="660" y="153" class="box-title" text-anchor="middle" fill="#ffffff">4</text><rect x="585" y="195" width="150" height="145" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2" /><rect x="585" y="195" width="7" height="145" rx="3.5" fill="#b96800"/><text x="609" y="229" class="box-title" text-anchor="start" fill="#172033" font-size="18">定位根因</text><text x="609" y="259" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="609" dy="0">Manifest</tspan><tspan x="609" dy="1.35em">检查缺失位置</tspan></text><line x1="735" y1="268" x2="757" y2="268" stroke="#5f6b7a" stroke-width="2"  marker-end="url(#arrow-5f6b7a)"/><circle cx="840" cy="145" r="28" fill="#16845b"/><text x="840" y="153" class="box-title" text-anchor="middle" fill="#ffffff">5</text><rect x="765" y="195" width="150" height="145" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="765" y="195" width="7" height="145" rx="3.5" fill="#16845b"/><text x="789" y="229" class="box-title" text-anchor="start" fill="#172033" font-size="18">修复复测</text><text x="789" y="259" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="789" dy="0">同一输入被拒</tspan><tspan x="789" dy="1.35em">合法流程仍通过</tspan></text><rect x="75" y="405" width="810" height="128" rx="14" fill="#fff1f2" stroke="#cbd5e1" stroke-width="2" /><rect x="75" y="405" width="7" height="128" rx="3.5" fill="#c2413c"/><text x="99" y="439" class="box-title" text-anchor="start" fill="#172033" font-size="20">一条可复核结论至少包含</text><text x="99" y="469" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="99" dy="0">环境与版本 · 调用身份 · 精确入口 · 前置状态 · 完整输入 · 观察结果 · 对照 · 根因 · 复测</tspan><tspan x="99" dy="1.35em">“Provider 已导出”只是配置事实；越权结论还需要未授权身份获得受保护结果的证据。</tspan></text><text x="480" y="585" class="label" text-anchor="middle" fill="#172033" font-weight="650">证据链越具体，修复前后越容易执行同条件复测</text>
</svg>
