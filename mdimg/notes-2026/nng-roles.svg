<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 635" role="img" aria-labelledby="title desc">
  <title id="title">NNG 传输角色与协议角色正交</title>
  <desc id="desc">REP 可以主动拨号连接正在监听的 REQ，建立后仍由 REQ 先发送请求</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="635" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">NNG 传输角色与协议角色正交</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">REP 可以主动拨号连接正在监听的 REQ，建立后仍由 REQ 先发送请求</text>
  <rect x="70" y="150" width="300" height="210" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="70" y="150" width="7" height="210" rx="3.5" fill="#2563eb"/><text x="94" y="184" class="box-title" text-anchor="start" fill="#172033" font-size="20">REQ socket</text><text x="94" y="214" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="94" dy="0">nng_req0_open</tspan><tspan x="94" dy="1.35em">listen tcp://127.0.0.1:18885</tspan><tspan x="94" dy="1.35em">协议角色：发请求 / 收回复</tspan></text><rect x="590" y="150" width="300" height="210" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="590" y="150" width="7" height="210" rx="3.5" fill="#16845b"/><text x="614" y="184" class="box-title" text-anchor="start" fill="#172033" font-size="20">REP socket</text><text x="614" y="214" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="614" dy="0">nng_rep0_open</tspan><tspan x="614" dy="1.35em">dial tcp://127.0.0.1:18885</tspan><tspan x="614" dy="1.35em">协议角色：收请求 / 发回复</tspan></text><line x1="590" y1="190" x2="370" y2="190" stroke="#5f6b7a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-5f6b7a)"/><text x="480.0" y="180.0" class="small" text-anchor="middle" fill="#5f6b7a" font-weight="650">连接建立：REP → REQ</text><line x1="370" y1="265" x2="590" y2="265" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/><text x="480.0" y="255.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650">请求：ping</text><line x1="590" y1="325" x2="370" y2="325" stroke="#16845b" stroke-width="3"  marker-end="url(#arrow-16845b)"/><text x="480.0" y="315.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650">回复：pong</text><rect x="130" y="430" width="700" height="94" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="130" y="430" width="7" height="94" rx="3.5" fill="#7c3aed"/><text x="154" y="464" class="box-title" text-anchor="start" fill="#172033" font-size="20">两个维度要分开</text><text x="154" y="494" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="154" dy="0">dial / listen 决定传输连接由谁发起；REQ / REP 决定消息状态机中的先后顺序。</tspan></text><rect x="214" y="555" width="220" height="34" rx="17.0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" /><text x="324.0" y="578.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">连接方向 ≠ 消息方向</text><rect x="520" y="555" width="220" height="34" rx="17.0" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" /><text x="630.0" y="578.0" class="small" text-anchor="middle" fill="#0891b2" font-weight="650">协议状态机仍然有效</text>
</svg>
