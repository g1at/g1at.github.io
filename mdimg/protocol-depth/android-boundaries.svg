<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">Android 漏洞分析要从入口跟到敏感操作</title>
  <desc id="desc">导出或可控输入只是起点，风险取决于信任边界后的实际检查</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker><style>
      .title { font: 700 30px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .box-title { font: 700 20px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font: 500 18px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .small { font: 500 16px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .tiny { font: 500 13px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'Cascadia Mono', Consolas, monospace; fill: #172033; }
      .hair { shape-rendering: crispEdges; }
    </style></defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">Android 漏洞分析要从入口跟到敏感操作</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">导出或可控输入只是起点，风险取决于信任边界后的实际检查</text>
  <text x="55" y="125" class="box-title" text-anchor="start" fill="#c2413c">不可信输入</text><rect x="55" y="155" width="205" height="34" rx="17.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.5" /><text x="157.5" y="178.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">Intent / deep link</text><line x1="260" y1="172" x2="350" y2="172" stroke="#c2413c" stroke-width="2"  marker-end="url(#arrow-c2413c)"/><rect x="55" y="235" width="205" height="34" rx="17.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.5" /><text x="157.5" y="258.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">Provider URI</text><line x1="260" y1="252" x2="350" y2="252" stroke="#c2413c" stroke-width="2"  marker-end="url(#arrow-c2413c)"/><rect x="55" y="315" width="205" height="34" rx="17.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.5" /><text x="157.5" y="338.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">Binder / 消息</text><line x1="260" y1="332" x2="350" y2="332" stroke="#c2413c" stroke-width="2"  marker-end="url(#arrow-c2413c)"/><rect x="55" y="395" width="205" height="34" rx="17.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.5" /><text x="157.5" y="418.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650">URL / 文件名 / JSON</text><line x1="260" y1="412" x2="350" y2="412" stroke="#c2413c" stroke-width="2"  marker-end="url(#arrow-c2413c)"/><rect x="350" y="150" width="230" height="285" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="350" y="150" width="7" height="285" rx="3.5" fill="#2563eb"/><text x="374" y="184" class="box-title" text-anchor="start" fill="#172033" font-size="20">Android 入口</text><text x="374" y="214" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="374" dy="0">Activity</tspan><tspan x="374" dy="1.35em">Service</tspan><tspan x="374" dy="1.35em">Receiver</tspan><tspan x="374" dy="1.35em">ContentProvider</tspan><tspan x="374" dy="1.35em">WebView / 本地端口</tspan></text><line x1="580" y1="292" x2="675" y2="292" stroke="#7c3aed" stroke-width="4"  marker-end="url(#arrow-7c3aed)"/><text x="627.5" y="282.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650">跨信任边界</text><rect x="675" y="150" width="230" height="285" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="675" y="150" width="7" height="285" rx="3.5" fill="#16845b"/><text x="699" y="184" class="box-title" text-anchor="start" fill="#172033" font-size="20">敏感操作</text><text x="699" y="214" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="699" dy="0">读写私有数据</tspan><tspan x="699" dy="1.35em">调用后端 API</tspan><tspan x="699" dy="1.35em">启动系统能力</tspan><tspan x="699" dy="1.35em">导出文件 / 解压</tspan><tspan x="699" dy="1.35em">执行高权限业务动作</tspan></text><rect x="260" y="490" width="440" height="112" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="260" y="490" width="7" height="112" rx="3.5" fill="#7c3aed"/><text x="284" y="524" class="box-title" text-anchor="start" fill="#172033" font-size="20">必须在敏感操作之前完成</text><text x="284" y="554" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="284" dy="0">调用身份 · 对象归属 · 参数白名单</tspan><tspan x="284" dy="1.35em">路径边界 · 当前会话与状态</tspan></text><line x1="480" y1="490" x2="480" y2="435" stroke="#7c3aed" stroke-width="3"  marker-end="url(#arrow-7c3aed)"/>
</svg>
