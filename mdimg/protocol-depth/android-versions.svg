    </style></defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="48" y="52" class="title" text-anchor="start">Android 安全行为依赖系统与 target SDK</text>
  <text x="48" y="80" class="subtitle" text-anchor="start">导出声明、动态广播和 WebView 默认值都有明确的版本边界</text>
  <line x1="90" y1="200" x2="875" y2="200" stroke="#cbd5e1" stroke-width="6"/><circle cx="130" cy="200" r="12" fill="#b96800" stroke="white" stroke-width="3"/><text x="130" y="165" class="small" text-anchor="middle" fill="#b96800" font-weight="700">target &lt; 30</text><rect x="35" y="245" width="190" height="125" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2" /><rect x="35" y="245" width="7" height="125" rx="3.5" fill="#b96800"/><text x="59" y="279" class="box-title" text-anchor="start" fill="#172033" font-size="18">WebView</text><text x="59" y="309" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="59" dy="0">allowFileAccess</tspan><tspan x="59" dy="1.35em">默认 true</tspan></text><circle cx="330" cy="200" r="12" fill="#16845b" stroke="white" stroke-width="3"/><text x="330" y="165" class="small" text-anchor="middle" fill="#16845b" font-weight="700">target 30+</text><rect x="235" y="245" width="190" height="125" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" /><rect x="235" y="245" width="7" height="125" rx="3.5" fill="#16845b"/><text x="259" y="279" class="box-title" text-anchor="start" fill="#172033" font-size="18">WebView</text><text x="259" y="309" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="259" dy="0">allowFileAccess</tspan><tspan x="259" dy="1.35em">默认 false</tspan></text><circle cx="545" cy="200" r="12" fill="#2563eb" stroke="white" stroke-width="3"/><text x="545" y="165" class="small" text-anchor="middle" fill="#2563eb" font-weight="700">target 31+</text><rect x="450" y="245" width="190" height="125" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="450" y="245" width="7" height="125" rx="3.5" fill="#2563eb"/><text x="474" y="279" class="box-title" text-anchor="start" fill="#172033" font-size="18">Android 12</text><text x="474" y="309" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="474" dy="0">带 intent-filter</tspan><tspan x="474" dy="1.35em">组件显式声明</tspan><tspan x="474" dy="1.35em">android:exported</tspan></text><circle cx="785" cy="200" r="12" fill="#7c3aed" stroke="white" stroke-width="3"/><text x="785" y="165" class="small" text-anchor="middle" fill="#7c3aed" font-weight="700">target 34+</text><rect x="690" y="245" width="190" height="125" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="690" y="245" width="7" height="125" rx="3.5" fill="#7c3aed"/><text x="714" y="279" class="box-title" text-anchor="start" fill="#172033" font-size="18">Android 14</text><text x="714" y="309" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="714" dy="0">动态 Receiver</tspan><tspan x="714" dy="1.35em">声明导出标志</tspan></text><rect x="70" y="430" width="820" height="115" rx="14" fill="#fff1f2" stroke="#cbd5e1" stroke-width="2" /><rect x="70" y="430" width="7" height="115" rx="3.5" fill="#c2413c"/><text x="94" y="464" class="box-title" text-anchor="start" fill="#172033" font-size="20">记录成立条件</text><text x="94" y="494" class="small" text-anchor="start" fill="#5f6b7a"><tspan x="94" dy="0">OS 版本 · target SDK · 合并后的 Manifest · Network Security Config · 实际网络库 · 备份类型</tspan><tspan x="94" dy="1.35em">同一段源码在不同 target 或设备上可能表现不同。</tspan></text><text x="480" y="600" class="small" text-anchor="middle" fill="#5f6b7a">时间线只列文章涉及的边界，不代表完整 Android 行为变更表</text>
</svg>
