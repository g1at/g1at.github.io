<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Android 安全行为依赖系统与 target SDK</title>
  <desc id="desc">导出声明、动态广播和 WebView 默认值都有明确的版本边界</desc>
