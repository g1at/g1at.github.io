<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">APK 升级验证与业务请求防重放</title>
  <desc id="desc">升级链路同时校验传输、元数据、APK 签名与版本；业务请求同时绑定内容、校验时间窗口并原子去重</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <style>.t{font:700 30px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.sub{font:400 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#5f6b7a}.h{font:700 19px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.b{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#334155}.s{font:500 12.5px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#64748b}.m{font:600 12.5px 'Cascadia Mono',Consolas,monospace;fill:#1e3a8a}.bad{font:600 13px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#b91c1c}.good{font:600 13px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#047857}</style>
  </defs>
  <rect width="1120" height="760" fill="#fff"/>
  <text x="48" y="54" class="t">升级与请求：完整性校验之后还要处理“旧消息再次有效”</text>
  <text x="48" y="82" class="sub">加密和签名证明内容未被改写；版本、nonce、幂等键与对象授权决定它是否还能被执行</text>

  <rect x="45" y="120" width="1030" height="275" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="155" class="h">APK 升级链路</text>
  <g>
    <rect x="70" y="185" width="150" height="105" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="145" y="211" class="b" text-anchor="middle">HTTPS 元数据</text><text x="145" y="237" class="s" text-anchor="middle">versionCode</text><text x="145" y="258" class="s" text-anchor="middle">URL · size · SHA-256</text><text x="145" y="279" class="s" text-anchor="middle">发布时间 / 通道</text>
    <rect x="260" y="185" width="150" height="105" rx="11" fill="#f5f3ff" stroke="#c4b5fd"/><text x="335" y="211" class="b" text-anchor="middle">可信元数据</text><text x="335" y="237" class="s" text-anchor="middle">服务端认证 / 独立签名</text><text x="335" y="258" class="s" text-anchor="middle">下载地址与 hash 同时绑定</text><text x="335" y="279" class="s" text-anchor="middle">拒绝未知通道</text>
    <rect x="450" y="185" width="150" height="105" rx="11" fill="#fff7ed" stroke="#fdba74"/><text x="525" y="211" class="b" text-anchor="middle">临时文件下载</text><text x="525" y="237" class="s" text-anchor="middle">私有目录 · 大小上限</text><text x="525" y="258" class="s" text-anchor="middle">完整写入后 fsync/rename</text><text x="525" y="279" class="s" text-anchor="middle">SHA-256 匹配元数据</text>
    <rect x="640" y="185" width="170" height="105" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/><text x="725" y="211" class="b" text-anchor="middle">APK 身份</text><text x="725" y="237" class="m" text-anchor="middle">apksigner verify</text><text x="725" y="258" class="s" text-anchor="middle">包名 · 签名方案 · 证书沿革</text><text x="725" y="279" class="s" text-anchor="middle">交给 PackageInstaller 复核</text>
    <rect x="850" y="185" width="150" height="105" rx="11" fill="#ecfdf5" stroke="#34d399"/><text x="925" y="211" class="b" text-anchor="middle">版本策略</text><text x="925" y="237" class="s" text-anchor="middle">拒绝回滚 / 通道降级</text><text x="925" y="258" class="s" text-anchor="middle">确认用户可见安装</text><text x="925" y="279" class="s" text-anchor="middle">失败不替换现有包</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.6" marker-end="url(#a)"><line x1="220" y1="238" x2="260" y2="238"/><line x1="410" y1="238" x2="450" y2="238"/><line x1="600" y1="238" x2="640" y2="238"/><line x1="810" y1="238" x2="850" y2="238"/></g>
  <line x1="165" y1="335" x2="700" y2="335" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="165" y="326" class="bad">错误：APK 和它的 hash 来自同一个可篡改 HTTP 响应；两者可一起被替换</text>
  <text x="70" y="372" class="s">v1 的 META-INF/CERT.* 只是历史方案的一部分；检查 v1/v2/v3 与证书，使用 v4 时再核对单独的 .idsig。</text>

  <rect x="45" y="430" width="1030" height="275" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="465" class="h">带认证的业务请求仍可能被重放</text>
  <g>
    <rect x="70" y="495" width="170" height="108" rx="11" fill="#fff1f2" stroke="#fda4af"/><text x="155" y="521" class="b" text-anchor="middle">规范化请求</text><text x="155" y="546" class="m" text-anchor="middle">method + path</text><text x="155" y="568" class="m" text-anchor="middle">timestamp + nonce</text><text x="155" y="590" class="m" text-anchor="middle">SHA-256(body)</text>
    <rect x="280" y="495" width="155" height="108" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="357" y="521" class="b" text-anchor="middle">认证标签</text><text x="357" y="548" class="m" text-anchor="middle">HMAC / signature</text><text x="357" y="570" class="s" text-anchor="middle">常量时间比较</text><text x="357" y="590" class="s" text-anchor="middle">密钥不放普通常量</text>
    <rect x="475" y="495" width="155" height="108" rx="11" fill="#fff7ed" stroke="#fdba74"/><text x="552" y="521" class="b" text-anchor="middle">时效</text><text x="552" y="548" class="m" text-anchor="middle">abs(now-ts) ≤ 60s</text><text x="552" y="570" class="s" text-anchor="middle">时钟偏差策略</text><text x="552" y="590" class="s" text-anchor="middle">过期立即拒绝</text>
    <rect x="670" y="495" width="165" height="108" rx="11" fill="#f5f3ff" stroke="#c4b5fd"/><text x="752" y="521" class="b" text-anchor="middle">原子去重</text><text x="752" y="548" class="m" text-anchor="middle">subject + nonce</text><text x="752" y="570" class="s" text-anchor="middle">共享、带 TTL 的唯一约束</text><text x="752" y="590" class="s" text-anchor="middle">幂等键绑定响应</text>
    <rect x="875" y="495" width="150" height="108" rx="11" fill="#ecfdf5" stroke="#34d399"/><text x="950" y="521" class="b" text-anchor="middle">业务授权</text><text x="950" y="548" class="s" text-anchor="middle">对象属于认证主体</text><text x="950" y="570" class="s" text-anchor="middle">状态允许这次转换</text><text x="950" y="590" class="s" text-anchor="middle">事务内执行一次</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.6" marker-end="url(#a)"><line x1="240" y1="549" x2="280" y2="549"/><line x1="435" y1="549" x2="475" y2="549"/><line x1="630" y1="549" x2="670" y2="549"/><line x1="835" y1="549" x2="875" y2="549"/></g>
  <line x1="165" y1="650" x2="700" y2="650" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="165" y="641" class="bad">同一份密文或同一份有效签名再次发送，密码学校验仍然会成功</text>
  <text x="165" y="681" class="good">接受记录必须原子写入；多实例服务只放进单机内存 Set 会被换节点绕过。</text>
</svg>
