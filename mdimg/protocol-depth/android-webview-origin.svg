<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
  <title id="title">WebView 导航与 Native Bridge 的信任边界</title>
  <desc id="desc">每次导航都解析并检查 scheme host port userinfo，重定向逐跳复核，只有受信页面可接触最小化原生接口</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <style>.t{font:700 30px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.sub{font:400 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#5f6b7a}.h{font:700 18px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.b{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#334155}.s{font:500 12.5px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#64748b}.m{font:600 12px 'Cascadia Mono',Consolas,monospace;fill:#1e3a8a}.bad{font:600 13px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#b91c1c}.good{font:600 13px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#047857}</style>
  </defs>
  <rect width="1120" height="750" fill="#fff"/>
  <text x="48" y="54" class="t">WebView：URL 合法只是起点，Bridge 决定最终权限</text>
  <text x="48" y="82" class="sub">TLS 认证当前连接的主机；应用仍要决定哪个 origin 可以导航、执行脚本以及调用原生能力</text>

  <rect x="45" y="128" width="190" height="300" rx="15" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <text x="68" y="163" class="h">URL 来源</text>
  <text x="68" y="198" class="b"><tspan x="68">Deep Link / Intent extra</tspan><tspan x="68" dy="26">二维码 / 推送</tspan><tspan x="68" dy="26">后端返回链接</tspan><tspan x="68" dy="26">页面点击 / JS 跳转</tspan><tspan x="68" dy="26">HTTP 3xx 重定向</tspan></text>
  <rect x="67" y="345" width="146" height="53" rx="9" fill="#fff" stroke="#fda4af"/>
  <text x="140" y="367" class="m" text-anchor="middle">String is untrusted</text>
  <text x="140" y="387" class="s" text-anchor="middle">先解析，再比较</text>

  <rect x="280" y="112" width="270" height="330" rx="15" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="305" y="147" class="h">确定唯一 origin</text>
  <rect x="305" y="172" width="220" height="54" rx="9" fill="#fff" stroke="#93c5fd"/><text x="415" y="194" class="m" text-anchor="middle">scheme == https</text><text x="415" y="214" class="s" text-anchor="middle">拒绝 file/content/javascript/http</text>
  <rect x="305" y="237" width="220" height="54" rx="9" fill="#fff" stroke="#93c5fd"/><text x="415" y="259" class="m" text-anchor="middle">host == docs.example.com</text><text x="415" y="279" class="s" text-anchor="middle">完整比较；子域规则带点边界</text>
  <rect x="305" y="302" width="220" height="54" rx="9" fill="#fff" stroke="#93c5fd"/><text x="415" y="324" class="m" text-anchor="middle">port ∈ {-1, 443}</text><text x="415" y="344" class="s" text-anchor="middle">userinfo == null</text>
  <text x="305" y="386" class="s"><tspan x="305">拒绝控制字符、反斜杠和解析异常；</tspan><tspan x="305" dy="20">不要使用 contains("example.com")。</tspan></text>

  <rect x="595" y="128" width="210" height="300" rx="15" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="620" y="163" class="h">每个导航点复核</text>
  <text x="620" y="198" class="b"><tspan x="620">首次 loadUrl</tspan><tspan x="620" dy="27">shouldOverrideUrlLoading</tspan><tspan x="620" dy="27">重定向后的 URL</tspan><tspan x="620" dy="27">新窗口 / 外部协议</tspan></text>
  <rect x="620" y="318" width="160" height="78" rx="9" fill="#fff" stroke="#c4b5fd"/>
  <text x="700" y="341" class="b" text-anchor="middle">不在允许集合</text>
  <text x="700" y="362" class="s" text-anchor="middle">交给系统浏览器</text>
  <text x="700" y="382" class="s" text-anchor="middle">或明确拒绝</text>

  <rect x="850" y="112" width="225" height="330" rx="15" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="875" y="147" class="h">受信 WebView</text>
  <text x="875" y="180" class="b"><tspan x="875">仅业务需要时启用 JS</tspan><tspan x="875" dy="26">禁用不需要的 file/content</tspan><tspan x="875" dy="26">Mixed content = NEVER</tspan><tspan x="875" dy="26">SSL 错误 cancel</tspan></text>
  <rect x="875" y="305" width="175" height="96" rx="10" fill="#fff" stroke="#6ee7b7"/>
  <text x="962" y="331" class="b" text-anchor="middle">最小 Native Bridge</text>
  <text x="962" y="354" class="s" text-anchor="middle">无 token / 文件通用读取</text>
  <text x="962" y="376" class="s" text-anchor="middle">每个动作仍做业务授权</text>
  <text x="962" y="394" class="s" text-anchor="middle">不可信页面加载前 remove</text>

  <g stroke="#2563eb" stroke-width="2.8" marker-end="url(#a)"><line x1="235" y1="275" x2="280" y2="275"/><line x1="550" y1="275" x2="595" y2="275"/><line x1="805" y1="275" x2="850" y2="275"/></g>

  <rect x="45" y="490" width="1030" height="205" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="525" class="h">两个容易漏掉的分支</text>
  <rect x="75" y="550" width="445" height="105" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="95" y="578" class="bad">允许页 → 302 → evil.test</text>
  <text x="95" y="603" class="s">只检查第一个 URL，后续页面仍能进入同一个 WebView。</text>
  <text x="95" y="628" class="good">处理：每一跳重新解析 origin；不合规即停止或外部打开。</text>
  <rect x="555" y="550" width="485" height="105" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="575" y="578" class="bad">受信主框架 + 不可信 iframe / 注入脚本 → Bridge</text>
  <text x="575" y="603" class="s">页面 URL 合法，不代表所有 frame 与子资源都可信。</text>
  <text x="575" y="628" class="good">处理：Bridge 只暴露必要动作；内容隔离，服务端与原生端都授权。</text>
  <line x1="265" y1="680" x2="840" y2="680" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="265" y="673" class="bad">HTTPS 成功 ≠ 页面有权读取 App 私有数据或执行设备操作</text>
</svg>
