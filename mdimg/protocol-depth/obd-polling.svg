<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
  <title id="title">轮询吞吐量：先算总线，再看串行往返</title>
  <desc id="desc">同一目标顺序请求时，ECU 往返延迟会先于理论 CAN 带宽成为瓶颈。</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><style>
      .title { font:700 29px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .subtitle { font:400 15px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#5f6b7a; }
      .label { font:500 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .small { font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .tiny { font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family:'Cascadia Mono',Consolas,monospace; fill:#172033; }
    </style></defs>
  <rect width="960" height="670" fill="#ffffff"/>
  <text x="48" y="48" class="title" text-anchor="start">轮询吞吐量：先算总线，再看串行往返</text>
  <text x="48" y="76" class="subtitle" text-anchor="start">同一目标顺序请求时，ECU 往返延迟会先于理论 CAN 带宽成为瓶颈。</text>
  <rect x="48" y="112" width="414" height="308" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="112" width="6" height="308" rx="3" fill="#2563eb"/><text x="68" y="142" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">总线预算（理想单帧往返）</text><text x="78" y="172" class="mono" text-anchor="start" fill="#172033" font-weight="700" font-size="20">20 PID × 10 Hz</text><text x="78" y="202" class="mono" text-anchor="start" fill="#2563eb" font-weight="700" font-size="20">= 200 queries/s</text><line x1="255" y1="214" x2="255" y2="246" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-2563eb)"/><text x="78" y="278" class="mono" text-anchor="start" fill="#172033" font-weight="700" font-size="18">200 × 2 frames/query</text><text x="78" y="308" class="mono" text-anchor="start" fill="#2563eb" font-weight="700" font-size="20">= 400 frames/s</text><line x1="255" y1="320" x2="255" y2="349" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-2563eb)"/><rect x="78" y="360" width="352" height="38" rx="19.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="254.0" y="384.0" class="small" text-anchor="middle" fill="#2563eb" font-weight="650" font-size="16">400 × 130 / 500,000 ≈ 10.4%</text><rect x="498" y="112" width="414" height="308" rx="12" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/><rect x="498" y="112" width="6" height="308" rx="3" fill="#b96800"/><text x="518" y="142" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">串行 ECU 往返上限</text><text x="528" y="172" class="mono" text-anchor="start" fill="#172033" font-weight="700" font-size="20">平均 RTT = 20 ms</text><line x1="704" y1="187" x2="704" y2="224" stroke="#b96800" stroke-width="2.5" marker-end="url(#arrow-b96800)"/><text x="528" y="258" class="mono" text-anchor="start" fill="#b96800" font-weight="700" font-size="19">1000 / 20 = 50 queries/s</text><line x1="704" y1="272" x2="704" y2="309" stroke="#b96800" stroke-width="2.5" marker-end="url(#arrow-b96800)"/><rect x="528" y="329" width="352" height="42" rx="21.0" fill="#ffffff" stroke="#b96800" stroke-width="1.2"/><text x="704.0" y="355.0" class="small" text-anchor="middle" fill="#b96800" font-weight="650" font-size="16">50 / 20 PID = 2.5 Hz / PID</text><rect x="48" y="448" width="864" height="130" rx="12" fill="#fff1f2" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="448" width="6" height="130" rx="3" fill="#c2413c"/><text x="68" y="478" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">瓶颈取更小者</text><text x="68" y="505" class="small" text-anchor="start" fill="#5f6b7a" font-size="15"><tspan x="68" dy="0">总线侧的 200 queries/s 只是目标；串行 20 ms RTT 把实际能力限制为 50 queries/s。</tspan><tspan x="68" dy="1.35em">因此每项达不到 10 Hz。缩短 sleep() 不会消除顺序请求的等待时间。</tspan></text><text x="48" y="611" class="small" text-anchor="start" fill="#5f6b7a">假设：经典 CAN、每次一条请求和一条响应、500 kbit/s；130 bit/帧仅为粗略预算。</text><text x="48" y="636" class="small" text-anchor="start" fill="#5f6b7a">实际值随帧格式、DLC、位填充、仲裁、多 ECU 回复、FC、重试和既有总线流量变化。</text>
</svg>
