<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">ContentProvider 查询与文件接口的两条独立安全链</title>
  <desc id="desc">结构化查询需要 URI 路由、权限、列和排序白名单、参数绑定与对象归属；openFile 需要模式、路径和目录边界检查</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <style>.t{font:700 30px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.sub{font:400 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#5f6b7a}.h{font:700 19px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.b{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#334155}.s{font:500 12.5px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#64748b}.m{font:600 12.5px 'Cascadia Mono',Consolas,monospace;fill:#1e3a8a}.bad{font:600 13px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#b91c1c}</style>
  </defs>
  <rect width="1120" height="760" fill="#fff"/>
  <text x="48" y="54" class="t">ContentProvider：SQL 与文件路径是两条独立边界</text>
  <text x="48" y="82" class="sub">参数绑定只约束 SQL 值；它不会替你选择表、列、排序，也不会判断调用者能否读取这条记录</text>

  <rect x="45" y="120" width="1030" height="275" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="155" class="h">query / insert / update / delete</text>
  <g>
    <rect x="70" y="185" width="145" height="105" rx="11" fill="#fff1f2" stroke="#fda4af"/><text x="142" y="211" class="b" text-anchor="middle">不可信调用</text><text x="142" y="237" class="m" text-anchor="middle">content://…/reports/7</text><text x="142" y="260" class="s" text-anchor="middle">projection / selection</text><text x="142" y="279" class="s" text-anchor="middle">sortOrder / values</text>
    <rect x="250" y="185" width="145" height="105" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="322" y="211" class="b" text-anchor="middle">URI 路由</text><text x="322" y="237" class="m" text-anchor="middle">UriMatcher</text><text x="322" y="260" class="s" text-anchor="middle">固定 authority / path</text><text x="322" y="279" class="s" text-anchor="middle">未知模式立即拒绝</text>
    <rect x="430" y="185" width="145" height="105" rx="11" fill="#f5f3ff" stroke="#c4b5fd"/><text x="502" y="211" class="b" text-anchor="middle">访问能力</text><text x="502" y="237" class="s" text-anchor="middle">read/write permission</text><text x="502" y="260" class="s" text-anchor="middle">URI grant 范围</text><text x="502" y="279" class="s" text-anchor="middle">调用 UID / 业务会话</text>
    <rect x="610" y="185" width="145" height="105" rx="11" fill="#fff7ed" stroke="#fdba74"/><text x="682" y="211" class="b" text-anchor="middle">SQL 结构</text><text x="682" y="237" class="s" text-anchor="middle">列 / 排序允许集合</text><text x="682" y="260" class="m" text-anchor="middle">owner_id=?</text><text x="682" y="279" class="s" text-anchor="middle">值放 selectionArgs</text>
    <rect x="790" y="185" width="145" height="105" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/><text x="862" y="211" class="b" text-anchor="middle">对象授权</text><text x="862" y="237" class="m" text-anchor="middle">id=? AND owner_id=?</text><text x="862" y="260" class="s" text-anchor="middle">认证主体来自可信上下文</text><text x="862" y="279" class="s" text-anchor="middle">不是 extras 自报 userId</text>
    <rect x="970" y="202" width="80" height="72" rx="11" fill="#ecfdf5" stroke="#34d399"/><text x="1010" y="232" class="b" text-anchor="middle">Cursor</text><text x="1010" y="255" class="s" text-anchor="middle">最小列</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"><line x1="215" y1="238" x2="250" y2="238"/><line x1="395" y1="238" x2="430" y2="238"/><line x1="575" y1="238" x2="610" y2="238"/><line x1="755" y1="238" x2="790" y2="238"/><line x1="935" y1="238" x2="970" y2="238"/></g>
  <line x1="260" y1="325" x2="845" y2="325" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="260" y="315" class="bad">危险捷径：把调用者的 selection、projection 或 sortOrder 原样交给 SQLite</text>
  <text x="70" y="365" class="s">即使用了 “?”，表名、列名和排序方向也不能作为普通值绑定；要把外部名称映射到固定表达式。授权条件应由 Provider 自己追加。</text>

  <rect x="45" y="425" width="1030" height="275" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="460" class="h">openFile / openAssetFile</text>
  <g>
    <rect x="70" y="490" width="155" height="105" rx="11" fill="#fff1f2" stroke="#fda4af"/><text x="147" y="516" class="b" text-anchor="middle">URI + mode</text><text x="147" y="542" class="m" text-anchor="middle">…/exports/../../x</text><text x="147" y="565" class="s" text-anchor="middle">"r" / "w" / "rw"</text><text x="147" y="584" class="s" text-anchor="middle">编码分隔符也要考虑</text>
    <rect x="270" y="490" width="155" height="105" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="347" y="516" class="b" text-anchor="middle">能力与模式</text><text x="347" y="542" class="s" text-anchor="middle">只读 URI 拒绝写模式</text><text x="347" y="565" class="s" text-anchor="middle">临时 grant 精确到 URI</text><text x="347" y="584" class="s" text-anchor="middle">拒绝 prefix 扩大</text>
    <rect x="470" y="490" width="175" height="105" rx="11" fill="#fff7ed" stroke="#fdba74"/><text x="557" y="516" class="b" text-anchor="middle">解析业务标识</text><text x="557" y="542" class="s" text-anchor="middle">URI segment → 数据库 ID</text><text x="557" y="565" class="s" text-anchor="middle">ID → 服务端保存的相对路径</text><text x="557" y="584" class="s" text-anchor="middle">不直接采用外部文件名</text>
    <rect x="690" y="490" width="175" height="105" rx="11" fill="#f5f3ff" stroke="#c4b5fd"/><text x="777" y="516" class="b" text-anchor="middle">目录边界</text><text x="777" y="542" class="m" text-anchor="middle">canonical / normalize</text><text x="777" y="565" class="s" text-anchor="middle">target 必须位于 privateRoot/</text><text x="777" y="584" class="s" text-anchor="middle">防 symlink 与并发替换</text>
    <rect x="910" y="507" width="140" height="72" rx="11" fill="#ecfdf5" stroke="#34d399"/><text x="980" y="537" class="b" text-anchor="middle">ParcelFileDescriptor</text><text x="980" y="560" class="s" text-anchor="middle">最小打开模式</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"><line x1="225" y1="543" x2="270" y2="543"/><line x1="425" y1="543" x2="470" y2="543"/><line x1="645" y1="543" x2="690" y2="543"/><line x1="865" y1="543" x2="910" y2="543"/></g>
  <line x1="225" y1="635" x2="760" y2="635" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="225" y="625" class="bad">危险捷径：new File(root, uri.getLastPathSegment()) 后直接打开</text>
  <text x="70" y="675" class="s">SQL 注入、行级越权和路径穿越会出现在同一个 Provider 中，但需要分别构造证据、分别修复、分别做正反回归。</text>
</svg>
