<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Binder 调用者身份：在事务入口固定主体</title>
  <desc id="desc">外部 UID 在入站事务中读取并完成方法级授权；后台任务接收显式、已验证的主体与资源范围。</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><style>
      .title { font:700 29px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .subtitle { font:400 15px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#5f6b7a; }
      .label { font:500 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .small { font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .tiny { font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family:'Cascadia Mono',Consolas,monospace; fill:#172033; }
    </style></defs>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="48" y="48" class="title" text-anchor="start">Binder 调用者身份：在事务入口固定主体</text>
  <text x="48" y="76" class="subtitle" text-anchor="start">外部 UID 在入站事务中读取并完成方法级授权；后台任务接收显式、已验证的主体与资源范围。</text>
  <rect x="38" y="120" width="160" height="132" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="38" y="120" width="6" height="132" rx="3" fill="#2563eb"/><text x="58" y="150" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="16">外部 App</text><text x="58" y="177" class="small" text-anchor="start" fill="#5f6b7a" font-size="13"><tspan x="58" dy="0">远端主体</tspan><tspan x="58" dy="1.4em">uid_ext</tspan></text><line x1="203" y1="186" x2="220" y2="186" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow-5f6b7a)"/><rect x="226" y="120" width="200" height="132" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="226" y="120" width="6" height="132" rx="3" fill="#7c3aed"/><text x="246" y="150" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="16">Binder 入站事务</text><text x="246" y="177" class="small" text-anchor="start" fill="#5f6b7a" font-size="13"><tspan x="246" dy="0">立即读取</tspan><tspan x="246" dy="1.4em">getCallingUid()</tspan></text><line x1="431" y1="186" x2="448" y2="186" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow-5f6b7a)"/><rect x="454" y="120" width="210" height="132" rx="12" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/><rect x="454" y="120" width="6" height="132" rx="3" fill="#b96800"/><text x="474" y="150" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="16">方法级授权</text><text x="474" y="177" class="small" text-anchor="start" fill="#5f6b7a" font-size="13"><tspan x="474" dy="0">组件 / 方法权限</tspan><tspan x="474" dy="1.4em">资源归属与范围</tspan></text><line x1="669" y1="186" x2="686" y2="186" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow-5f6b7a)"/><rect x="692" y="120" width="230" height="132" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/><rect x="692" y="120" width="6" height="132" rx="3" fill="#16845b"/><text x="712" y="150" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="16">显式授权上下文</text><text x="712" y="177" class="small" text-anchor="start" fill="#5f6b7a" font-size="13"><tspan x="712" dy="0">subject = uid_ext</tspan><tspan x="712" dy="1.4em">scope = requested resource</tspan></text><text x="326" y="278" class="small" text-anchor="middle" fill="#7c3aed" font-weight="700">getCallingUid() 只在处理这次入站事务时代表远端调用者</text><line x1="326" y1="254" x2="326" y2="263" stroke="#7c3aed" stroke-width="2"/><text x="48" y="328" class="label" text-anchor="start" fill="#172033" font-weight="700">需要异步执行时</text><rect x="48" y="350" width="414" height="176" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="350" width="6" height="176" rx="3" fill="#16845b"/><text x="68" y="380" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">安全的数据流</text><text x="68" y="407" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="68" dy="0">1. 事务入口捕获 uid_ext</tspan><tspan x="68" dy="1.4em">2. 按方法与资源做授权</tspan><tspan x="68" dy="1.4em">3. 把已验证 subject + scope 交给 worker</tspan><tspan x="68" dy="1.4em">4. 执行前再检查可能撤销的业务状态</tspan></text><rect x="498" y="350" width="414" height="176" rx="12" fill="#fff1f2" stroke="#cbd5e1" stroke-width="1.5"/><rect x="498" y="350" width="6" height="176" rx="3" fill="#c2413c"/><text x="518" y="380" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">错误的身份恢复方式</text><text x="518" y="407" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="518" dy="0">worker 已不在原 Binder 事务中</tspan><tspan x="518" dy="1.4em">此时再次 getCallingUid()</tspan><tspan x="518" dy="1.4em">可能得到服务自身 UID</tspan><tspan x="518" dy="1.4em">不能据此还原 uid_ext</tspan></text><line x1="735" y1="330" x2="735" y2="345" stroke="#c2413c" stroke-width="2.2" marker-end="url(#arrow-c2413c)"/><rect x="538" y="544" width="334" height="36" rx="18.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.2"/><text x="705.0" y="567.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650" font-size="14">异步线程 ≠ 原调用者身份上下文</text><rect x="48" y="578" width="864" height="86" rx="12" fill="#ecfeff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="578" width="6" height="86" rx="3" fill="#0891b2"/><text x="68" y="608" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="17">审计时再看两处</text><text x="68" y="635" class="small" text-anchor="start" fill="#5f6b7a" font-size="13"><tspan x="68" dy="0">callerPackage / extras 是调用方可填的数据，不是 UID 证明；clearCallingIdentity() 前应完成授权，并在 finally 中恢复。</tspan></text>
</svg>
