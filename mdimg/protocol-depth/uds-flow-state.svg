<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
  <title id="title">ISO-TP 流控状态：BS=2 的 30 字节示例</title>
  <desc id="desc">FF 声明总长，CTS 放行连续帧；块计数与 4 bit CF 序号分别维护。</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><style>
      .title { font:700 29px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .subtitle { font:400 15px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#5f6b7a; }
      .label { font:500 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .small { font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .tiny { font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family:'Cascadia Mono',Consolas,monospace; fill:#172033; }
    </style></defs>
  <rect width="960" height="670" fill="#ffffff"/>
  <text x="48" y="48" class="title" text-anchor="start">ISO-TP 流控状态：BS=2 的 30 字节示例</text>
  <text x="48" y="76" class="subtitle" text-anchor="start">FF 声明总长，CTS 放行连续帧；块计数与 4 bit CF 序号分别维护。</text>
  <rect x="48" y="128" width="104" height="58" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="100.0" y="151" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">FF</text><text x="100.0" y="173" class="tiny" text-anchor="middle" fill="#2563eb" font-weight="650" font-size="12">6 B</text><line x1="157" y1="157" x2="172" y2="157" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow-5f6b7a)"/><rect x="178" y="128" width="120" height="58" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="238.0" y="151" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">FC #1</text><text x="238.0" y="173" class="tiny" text-anchor="middle" fill="#7c3aed" font-weight="650" font-size="12">CTS · BS=2</text><line x1="303" y1="157" x2="318" y2="157" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow-5f6b7a)"/><rect x="324" y="128" width="104" height="58" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="376.0" y="151" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">CF1</text><text x="376.0" y="173" class="tiny" text-anchor="middle" fill="#0891b2" font-weight="650" font-size="12">+7 B · SN1</text><line x1="433" y1="157" x2="448" y2="157" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow-5f6b7a)"/><rect x="454" y="128" width="104" height="58" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="506.0" y="151" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">CF2</text><text x="506.0" y="173" class="tiny" text-anchor="middle" fill="#0891b2" font-weight="650" font-size="12">+7 B · SN2</text><line x1="563" y1="157" x2="578" y2="157" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow-5f6b7a)"/><rect x="584" y="128" width="120" height="58" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="644.0" y="151" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">FC #2</text><text x="644.0" y="173" class="tiny" text-anchor="middle" fill="#7c3aed" font-weight="650" font-size="12">CTS · BS=2</text><line x1="709" y1="157" x2="724" y2="157" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow-5f6b7a)"/><rect x="730" y="128" width="94" height="58" rx="7" fill="#ecfdf5" stroke="#16845b" stroke-width="1.4"/><text x="777.0" y="151" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">CF3</text><text x="777.0" y="173" class="tiny" text-anchor="middle" fill="#16845b" font-weight="650" font-size="12">+7 B · SN3</text><line x1="829" y1="157" x2="836" y2="157" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow-5f6b7a)"/><rect x="842" y="128" width="70" height="58" rx="7" fill="#ecfdf5" stroke="#16845b" stroke-width="1.4"/><text x="877.0" y="151" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">CF4</text><text x="877.0" y="173" class="tiny" text-anchor="middle" fill="#16845b" font-weight="650" font-size="12">+3 B · SN4</text><text x="48" y="222" class="small" text-anchor="start" fill="#5f6b7a" font-weight="700">接收状态</text><rect x="145" y="203" width="118" height="32" rx="16.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="204.0" y="224.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650" font-size="14">WAIT_FC</text><line x1="270" y1="219" x2="324" y2="219" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-7c3aed)"/><rect x="324" y="203" width="234" height="32" rx="16.0" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/><text x="441.0" y="224.0" class="small" text-anchor="middle" fill="#0891b2" font-weight="650" font-size="14">RECEIVE_CF · block=2</text><line x1="565" y1="219" x2="584" y2="219" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-7c3aed)"/><rect x="584" y="203" width="118" height="32" rx="16.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="643.0" y="224.0" class="small" text-anchor="middle" fill="#7c3aed" font-weight="650" font-size="14">WAIT_FC</text><line x1="709" y1="219" x2="730" y2="219" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-7c3aed)"/><rect x="730" y="203" width="182" height="32" rx="16.0" fill="#ecfdf5" stroke="#16845b" stroke-width="1.2"/><text x="821.0" y="224.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650" font-size="14">RECEIVE_CF → DONE</text><rect x="48" y="274" width="864" height="98" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="274" width="6" height="98" rx="3" fill="#7c3aed"/><text x="68" y="304" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">BS=2 的含义</text><text x="68" y="331" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="68" dy="0">每收到 2 个 CF，发送端暂停并等待下一条 FC；第二条 CTS 后继续。</tspan><tspan x="68" dy="1.35em">block 计数在新 FC 后清零；CF 的 SN 不因 FC 清零，仍从 2 继续到 3。</tspan></text><rect x="48" y="418" width="172.8" height="78" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="134.4" y="447" class="small" text-anchor="middle" fill="#2563eb" font-weight="700">FF</text><text x="134.4" y="473" class="tiny" text-anchor="middle" fill="#5f6b7a">0–5</text><rect x="220.8" y="418" width="201.6" height="78" rx="4" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="321.6" y="447" class="small" text-anchor="middle" fill="#0891b2" font-weight="700">CF1</text><text x="321.6" y="473" class="tiny" text-anchor="middle" fill="#5f6b7a">6–12</text><rect x="422.4" y="418" width="201.6" height="78" rx="4" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="523.1999999999999" y="447" class="small" text-anchor="middle" fill="#0891b2" font-weight="700">CF2</text><text x="523.1999999999999" y="473" class="tiny" text-anchor="middle" fill="#5f6b7a">13–19</text><rect x="624.0" y="418" width="201.6" height="78" rx="4" fill="#ecfdf5" stroke="#16845b" stroke-width="1.4"/><text x="724.8" y="447" class="small" text-anchor="middle" fill="#16845b" font-weight="700">CF3</text><text x="724.8" y="473" class="tiny" text-anchor="middle" fill="#5f6b7a">20–26</text><rect x="825.6" y="418" width="86.4" height="78" rx="4" fill="#ecfdf5" stroke="#16845b" stroke-width="1.4"/><text x="868.8000000000001" y="447" class="small" text-anchor="middle" fill="#16845b" font-weight="700">CF4</text><text x="868.8000000000001" y="473" class="tiny" text-anchor="middle" fill="#5f6b7a">27–29</text><text x="48" y="404" class="label" text-anchor="start" fill="#172033" font-weight="700">30 字节 PDU：6 + 7 + 7 + 7 + 3</text><rect x="48" y="540" width="420" height="94" rx="12" fill="#ecfeff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="540" width="6" height="94" rx="3" fill="#0891b2"/><text x="68" y="570" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">序号域</text><text x="68" y="597" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="68" dy="0">next_SN = (SN + 1) &amp; 0x0F</tspan><tspan x="68" dy="1.35em">序列 1, 2, …, 15, 0, 1 …</tspan></text><rect x="492" y="540" width="420" height="94" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/><rect x="492" y="540" width="6" height="94" rx="3" fill="#16845b"/><text x="512" y="570" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">完成条件</text><text x="512" y="597" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="512" dy="0">累计 payload 长度达到 FF 声明值</tspan><tspan x="512" dy="1.35em">最后一个 CF 可只贡献剩余的 3 字节</tspan></text>
</svg>
