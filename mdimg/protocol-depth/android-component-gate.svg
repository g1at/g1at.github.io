<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">导出组件的入口、身份检查与敏感操作</title>
  <desc id="desc">外部调用进入 Android 组件后，应在原始调用语境中完成权限、会话、对象归属和参数检查，再进入异步任务与敏感操作</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <style>
      .t{font:700 30px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.sub{font:400 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#5f6b7a}.h{font:700 19px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.b{font:500 15px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#334155}.s{font:500 13px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#475569}.m{font:600 13px 'Cascadia Mono',Consolas,monospace;fill:#1e3a8a}.bad{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#b91c1c}
    </style>
  </defs>
  <rect width="1120" height="720" fill="#fff"/>
  <text x="48" y="54" class="t">导出组件：检查要发生在敏感操作之前</text>
  <text x="48" y="82" class="sub">Manifest 权限解决“谁能进门”；业务会话、对象归属和参数边界决定“进门后能做什么”</text>

  <rect x="45" y="135" width="190" height="330" rx="15" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <text x="68" y="170" class="h">外部调用者</text>
  <text x="68" y="205" class="b"><tspan x="68">第三方 App</tspan><tspan x="68" dy="24">adb shell / 测试 Agent</tspan><tspan x="68" dy="24">Deep Link / 广播</tspan><tspan x="68" dy="24">绑定 Service 客户端</tspan></text>
  <rect x="68" y="315" width="143" height="58" rx="10" fill="#fff" stroke="#fda4af"/>
  <text x="139" y="339" class="m" text-anchor="middle">UID 10234</text>
  <text x="139" y="360" class="s" text-anchor="middle">调用语境</text>
  <text x="68" y="410" class="s"><tspan x="68">输入：Intent extras</tspan><tspan x="68" dy="21">URI · Binder 参数</tspan><tspan x="68" dy="21">文件名 · 消息体</tspan></text>

  <rect x="285" y="135" width="205" height="330" rx="15" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="309" y="170" class="h">组件入口</text>
  <text x="309" y="205" class="b"><tspan x="309">Activity / Receiver</tspan><tspan x="309" dy="24">onStartCommand()</tspan><tspan x="309" dy="24">onBind() / Binder 方法</tspan><tspan x="309" dy="24">ContentProvider 方法</tspan></text>
  <rect x="309" y="315" width="157" height="78" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="387" y="339" class="m" text-anchor="middle">Binder.getCallingUid()</text>
  <text x="387" y="360" class="s" text-anchor="middle">在 Binder 入口读取</text>
  <text x="387" y="380" class="s" text-anchor="middle">再进入授权逻辑</text>
  <text x="309" y="426" class="s"><tspan x="309">Activity 场景不能把</tspan><tspan x="309" dy="20">getCallingActivity()!=null</tspan><tspan x="309" dy="20">当成可靠认证</tspan></text>

  <rect x="540" y="118" width="280" height="365" rx="15" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="565" y="154" class="h">入口处的四道门</text>
  <rect x="565" y="180" width="230" height="50" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="580" y="203" class="b">① 组件 / signature 权限</text><text x="580" y="221" class="s">checkCallingPermission 返回值</text>
  <rect x="565" y="242" width="230" height="50" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="580" y="265" class="b">② 会话与当前状态</text><text x="580" y="283" class="s">登录、设备绑定、一次性流程</text>
  <rect x="565" y="304" width="230" height="50" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="580" y="327" class="b">③ 对象归属</text><text x="580" y="345" class="s">requestedId 属于认证主体</text>
  <rect x="565" y="366" width="230" height="50" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="580" y="389" class="b">④ 类型、长度与允许集合</text><text x="580" y="407" class="s">拒绝未知 action / URI / mode</text>
  <text x="565" y="451" class="s">授权结果与必要身份一并传给异步任务。</text>

  <rect x="875" y="135" width="200" height="330" rx="15" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="899" y="170" class="h">敏感操作</text>
  <text x="899" y="210" class="b"><tspan x="899">读写私有文件</tspan><tspan x="899" dy="30">查询 / 修改数据库</tspan><tspan x="899" dy="30">设备控制与后台任务</tspan><tspan x="899" dy="30">转发 Intent / URI grant</tspan><tspan x="899" dy="30">调用后端业务 API</tspan></text>
  <rect x="899" y="365" width="152" height="66" rx="10" fill="#fff" stroke="#6ee7b7"/>
  <text x="975" y="391" class="b" text-anchor="middle">最小权限执行</text>
  <text x="975" y="414" class="s" text-anchor="middle">留下审计事件</text>

  <line x1="235" y1="290" x2="285" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="290" x2="540" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="820" y1="290" x2="875" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="65" y="525" width="990" height="145" rx="15" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="90" y="560" class="h">容易写错的时序</text>
  <line x1="95" y1="606" x2="315" y2="606" stroke="#dc2626" stroke-width="3" marker-end="url(#bad)"/>
  <text x="95" y="593" class="bad">入口</text><text x="205" y="593" class="bad" text-anchor="middle">clearCallingIdentity()</text><text x="345" y="593" class="bad">再检查权限：已换成自身身份</text>
  <line x1="575" y1="606" x2="795" y2="606" stroke="#dc2626" stroke-width="3" marker-end="url(#bad)"/>
  <text x="575" y="593" class="bad">入口</text><text x="685" y="593" class="bad" text-anchor="middle">post(handler)</text><text x="825" y="593" class="bad">异步线程再取 UID：语境已丢</text>
  <text x="90" y="645" class="s">正确做法：先在原始 Binder 调用中验证并提取不可伪造的主体，再清理身份或排队；Activity / Deep Link 则依靠显式入口约束、会话和对象授权。</text>
</svg>
