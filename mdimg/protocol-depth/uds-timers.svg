<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
  <title id="title">NRC 0x78：延长等待，但不越过总上限</title>
  <desc id="desc">每次 ResponsePending 从接收时刻重算 P2*，再与客户端 overall deadline 取最小值。</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><style>
      .title { font:700 29px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .subtitle { font:400 15px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#5f6b7a; }
      .label { font:500 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .small { font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .tiny { font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family:'Cascadia Mono',Consolas,monospace; fill:#172033; }
    </style></defs>
  <rect width="960" height="690" fill="#ffffff"/>
  <text x="48" y="48" class="title" text-anchor="start">NRC 0x78：延长等待，但不越过总上限</text>
  <text x="48" y="76" class="subtitle" text-anchor="start">每次 ResponsePending 从接收时刻重算 P2*，再与客户端 overall deadline 取最小值。</text>
  <text x="912" y="108" class="tiny" text-anchor="end" fill="#5f6b7a">示意间距，非线性比例</text><line x1="82" y1="178" x2="884" y2="178" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arrow-5f6b7a)"/><line x1="82" y1="164" x2="82" y2="192" stroke="#5f6b7a" stroke-width="2"/><text x="82" y="214" class="tiny" text-anchor="middle" fill="#5f6b7a">t=0</text><line x1="210" y1="164" x2="210" y2="192" stroke="#5f6b7a" stroke-width="2"/><text x="210" y="214" class="tiny" text-anchor="middle" fill="#5f6b7a">t=40</text><line x1="324" y1="164" x2="324" y2="192" stroke="#5f6b7a" stroke-width="2"/><text x="324" y="214" class="tiny" text-anchor="middle" fill="#5f6b7a">t=80</text><line x1="456" y1="164" x2="456" y2="192" stroke="#5f6b7a" stroke-width="2"/><text x="456" y="214" class="tiny" text-anchor="middle" fill="#5f6b7a">t=4040</text><line x1="604" y1="164" x2="604" y2="192" stroke="#5f6b7a" stroke-width="2"/><text x="604" y="214" class="tiny" text-anchor="middle" fill="#5f6b7a">t=5040</text><line x1="744" y1="164" x2="744" y2="192" stroke="#5f6b7a" stroke-width="2"/><text x="744" y="214" class="tiny" text-anchor="middle" fill="#5f6b7a">t=6000</text><line x1="884" y1="164" x2="884" y2="192" stroke="#5f6b7a" stroke-width="2"/><text x="884" y="214" class="tiny" text-anchor="middle" fill="#5f6b7a">t=7000</text><rect x="48" y="234" width="110" height="58" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="103.0" y="257" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">请求</text><text x="103.0" y="279" class="tiny" text-anchor="middle" fill="#2563eb" font-weight="650" font-size="12">deadline=80</text><rect x="174" y="234" width="116" height="58" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="232.0" y="257" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">NRC 78</text><text x="232.0" y="279" class="tiny" text-anchor="middle" fill="#7c3aed" font-weight="650" font-size="12">收到于 40</text><rect x="398" y="234" width="116" height="58" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="456.0" y="257" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">NRC 78</text><text x="456.0" y="279" class="tiny" text-anchor="middle" fill="#7c3aed" font-weight="650" font-size="12">收到于 4040</text><rect x="824" y="234" width="112" height="58" rx="7" fill="#fff1f2" stroke="#c2413c" stroke-width="1.4"/><text x="880.0" y="257" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">肯定响应</text><text x="880.0" y="279" class="tiny" text-anchor="middle" fill="#c2413c" font-weight="650" font-size="12">收到于 7000</text><text x="48" y="344" class="small" text-anchor="start" fill="#2563eb" font-weight="700">初始 P2</text><line x1="126" y1="338" x2="324" y2="338" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-2563eb)"/><text x="225" y="329" class="tiny" text-anchor="middle" fill="#2563eb">0 + 80 = 80 ms</text><text x="48" y="404" class="small" text-anchor="start" fill="#7c3aed" font-weight="700">第 1 次 78</text><line x1="144" y1="398" x2="604" y2="398" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-7c3aed)"/><text x="374" y="389" class="tiny" text-anchor="middle" fill="#7c3aed">min(40 + 5000, 6000) = 5040 ms</text><text x="48" y="464" class="small" text-anchor="start" fill="#7c3aed" font-weight="700">第 2 次 78</text><line x1="144" y1="458" x2="744" y2="458" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-7c3aed)"/><text x="444" y="449" class="tiny" text-anchor="middle" fill="#7c3aed">min(4040 + 5000, overall 6000) = 6000 ms</text><line x1="744" y1="120" x2="744" y2="500" stroke="#c2413c" stroke-width="2" stroke-dasharray="7 6"/><rect x="660" y="502" width="168" height="32" rx="16.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.2"/><text x="744.0" y="523.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650" font-size="14">全局上限 6000 ms</text><line x1="884" y1="542" x2="762" y2="542" stroke="#c2413c" stroke-width="2.5" marker-end="url(#arrow-c2413c)"/><text x="646" y="548" class="small" text-anchor="end" fill="#c2413c" font-weight="700">7000 ms 响应已晚到，客户端按超时处理</text><rect x="48" y="580" width="864" height="76" rx="12" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="580" width="6" height="76" rx="3" fill="#b96800"/><text x="68" y="610" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="17">参数边界</text><text x="68" y="637" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="68" dy="0">80 ms、5000 ms 与 overall=6000 ms 是此离线客户端样例的策略值，不是所有 ECU 的通用常数。</tspan></text>
</svg>
