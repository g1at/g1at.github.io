<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
  <title id="title">多 ECU 回复：交错帧，各自重组</title>
  <desc id="desc">同一时间线上，7E8 的多帧响应与 7E9 的单帧响应互不污染。</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><style>
      .title { font:700 29px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .subtitle { font:400 15px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#5f6b7a; }
      .label { font:500 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .small { font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .tiny { font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family:'Cascadia Mono',Consolas,monospace; fill:#172033; }
    </style></defs>
  <rect width="960" height="670" fill="#ffffff"/>
  <text x="48" y="48" class="title" text-anchor="start">多 ECU 回复：交错帧，各自重组</text>
  <text x="48" y="76" class="subtitle" text-anchor="start">同一时间线上，7E8 的多帧响应与 7E9 的单帧响应互不污染。</text>
  <text x="48" y="186" class="small" text-anchor="start" fill="#2563eb" font-weight="700">ECU A → Tester</text><line x1="190" y1="180" x2="900" y2="180" stroke="#cbd5e1" stroke-width="2"/><text x="48" y="286" class="small" text-anchor="start" fill="#7c3aed" font-weight="700">Tester → ECU A</text><line x1="190" y1="280" x2="900" y2="280" stroke="#cbd5e1" stroke-width="2"/><text x="48" y="386" class="small" text-anchor="start" fill="#16845b" font-weight="700">ECU B → Tester</text><line x1="190" y1="380" x2="900" y2="380" stroke="#cbd5e1" stroke-width="2"/><line x1="190" y1="115" x2="190" y2="420" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/><text x="190" y="110" class="tiny" text-anchor="middle" fill="#5f6b7a">0 ms</text><line x1="241" y1="115" x2="241" y2="420" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/><text x="241" y="110" class="tiny" text-anchor="middle" fill="#5f6b7a">1 ms</text><line x1="547" y1="115" x2="547" y2="420" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/><text x="547" y="110" class="tiny" text-anchor="middle" fill="#5f6b7a">7 ms</text><line x1="598" y1="115" x2="598" y2="420" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/><text x="598" y="110" class="tiny" text-anchor="middle" fill="#5f6b7a">8 ms</text><line x1="853" y1="115" x2="853" y2="420" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/><text x="853" y="110" class="tiny" text-anchor="middle" fill="#5f6b7a">13 ms</text><rect x="148" y="135" width="92" height="58" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="194.0" y="158" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">7E8 · FF</text><text x="194.0" y="180" class="tiny" text-anchor="middle" fill="#2563eb" font-weight="650" font-size="12">总长 20</text><rect x="196" y="245" width="96" height="58" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="244.0" y="268" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">7E0 · FC</text><text x="244.0" y="290" class="tiny" text-anchor="middle" fill="#7c3aed" font-weight="650" font-size="12">CTS · BS=0</text><rect x="502" y="135" width="94" height="58" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="549.0" y="158" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">7E8 · 21</text><text x="549.0" y="180" class="tiny" text-anchor="middle" fill="#2563eb" font-weight="650" font-size="12">CF1 · +7</text><rect x="553" y="345" width="94" height="58" rx="7" fill="#ecfdf5" stroke="#16845b" stroke-width="1.4"/><text x="600.0" y="368" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">7E9 · SF</text><text x="600.0" y="390" class="tiny" text-anchor="middle" fill="#16845b" font-weight="650" font-size="12">41 0C 1A F8</text><rect x="806" y="135" width="94" height="58" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="853.0" y="158" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="14">7E8 · 22</text><text x="853.0" y="180" class="tiny" text-anchor="middle" fill="#2563eb" font-weight="650" font-size="12">CF2 · +7</text><rect x="48" y="458" width="420" height="145" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="458" width="6" height="145" rx="3" fill="#2563eb"/><text x="68" y="488" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">连接 A：7E0 ↔ 7E8</text><text x="68" y="515" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="68" dy="0">FF 后缓存 6/20；next SN=1</tspan><tspan x="68" dy="1.35em">FC 发向 7E0（不是功能 ID 7DF）</tspan><tspan x="68" dy="1.35em">CF1 后 13/20；CF2 后 20/20，完成</tspan></text><rect x="492" y="458" width="420" height="145" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/><rect x="492" y="458" width="6" height="145" rx="3" fill="#16845b"/><text x="512" y="488" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">连接 B：7E1 ↔ 7E9</text><text x="512" y="515" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="512" dy="0">8 ms 的 SF 独立完成</tspan><tspan x="512" dy="1.35em">不会改变连接 A 的长度、缓存或 SN</tspan><tspan x="512" dy="1.35em">这条单帧消息不需要 FC</tspan></text><text x="48" y="636" class="small" text-anchor="start" fill="#5f6b7a">状态键 =（通道、地址模式、请求 ID、响应 ID、方向）</text><rect x="680" y="619" width="232" height="34" rx="17.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.2"/><text x="796.0" y="641.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650" font-size="13">不能共用一个全局 ISO-TP 状态</text>
</svg>
