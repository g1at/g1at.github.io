<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" role="img" aria-labelledby="title desc">
  <title id="title">下载块计数与 ISO-TP 序号：两个层次</title>
  <desc id="desc">4 KiB 下载分成 16 个应用块；每个 258 字节请求又分成 FF 和 36 个 CF。</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><style>
      .title { font:700 29px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .subtitle { font:400 15px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#5f6b7a; }
      .label { font:500 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .small { font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .tiny { font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family:'Cascadia Mono',Consolas,monospace; fill:#172033; }
    </style></defs>
  <rect width="960" height="730" fill="#ffffff"/>
  <text x="48" y="48" class="title" text-anchor="start">下载块计数与 ISO-TP 序号：两个层次</text>
  <text x="48" y="76" class="subtitle" text-anchor="start">4 KiB 下载分成 16 个应用块；每个 258 字节请求又分成 FF 和 36 个 CF。</text>
  <text x="48" y="111" class="label" text-anchor="start" fill="#172033" font-weight="700">RequestDownload 肯定响应</text><rect x="48" y="129" width="110" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="103.0" y="158" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">74</text><text x="103.0" y="185" class="tiny" text-anchor="middle" fill="#2563eb" font-weight="650" font-size="11">positive SID</text><rect x="168" y="129" width="128" height="72" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="232.0" y="158" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">20</text><text x="232.0" y="185" class="tiny" text-anchor="middle" fill="#7c3aed" font-weight="650" font-size="11">长度格式</text><rect x="306" y="129" width="238" height="72" rx="6" fill="#ecfdf5" stroke="#16845b" stroke-width="1.4"/><text x="425.0" y="158" class="mono" text-anchor="middle" fill="#172033" font-weight="700" font-size="18">01 02</text><text x="425.0" y="185" class="tiny" text-anchor="middle" fill="#16845b" font-weight="650" font-size="11">maxNumberOfBlockLength</text><rect x="606" y="120" width="306" height="90" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/><rect x="606" y="120" width="6" height="90" rx="3" fill="#16845b"/><text x="626" y="150" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="17">0x0102 = 258 字节</text><text x="626" y="177" class="small" text-anchor="start" fill="#5f6b7a" font-size="13"><tspan x="626" dy="0">36 | BSC | data≤256</tspan><tspan x="626" dy="1.35em">长度包含 SID 与 BSC</tspan></text><text x="48" y="252" class="label" text-anchor="start" fill="#172033" font-weight="700">4 KiB 镜像 → 16 个 TransferData 块</text><rect x="48" y="271" width="50" height="64" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="73.0" y="296" class="mono" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="13">01</text><text x="73.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="102" y="271" width="50" height="64" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="127.0" y="296" class="mono" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="13">02</text><text x="127.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="156" y="271" width="50" height="64" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="181.0" y="296" class="mono" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="13">03</text><text x="181.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="210" y="271" width="50" height="64" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="235.0" y="296" class="mono" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="13">04</text><text x="235.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="264" y="271" width="50" height="64" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="289.0" y="296" class="mono" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="13">05</text><text x="289.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="318" y="271" width="50" height="64" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="343.0" y="296" class="mono" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="13">06</text><text x="343.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="372" y="271" width="50" height="64" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="397.0" y="296" class="mono" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="13">07</text><text x="397.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="426" y="271" width="50" height="64" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="451.0" y="296" class="mono" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="13">08</text><text x="451.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="480" y="271" width="50" height="64" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="505.0" y="296" class="mono" text-anchor="middle" fill="#0891b2" font-weight="700" font-size="13">09</text><text x="505.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="534" y="271" width="50" height="64" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="559.0" y="296" class="mono" text-anchor="middle" fill="#0891b2" font-weight="700" font-size="13">0A</text><text x="559.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="588" y="271" width="50" height="64" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="613.0" y="296" class="mono" text-anchor="middle" fill="#0891b2" font-weight="700" font-size="13">0B</text><text x="613.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="642" y="271" width="50" height="64" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="667.0" y="296" class="mono" text-anchor="middle" fill="#0891b2" font-weight="700" font-size="13">0C</text><text x="667.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="696" y="271" width="50" height="64" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="721.0" y="296" class="mono" text-anchor="middle" fill="#0891b2" font-weight="700" font-size="13">0D</text><text x="721.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="750" y="271" width="50" height="64" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="775.0" y="296" class="mono" text-anchor="middle" fill="#0891b2" font-weight="700" font-size="13">0E</text><text x="775.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="804" y="271" width="50" height="64" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="829.0" y="296" class="mono" text-anchor="middle" fill="#0891b2" font-weight="700" font-size="13">0F</text><text x="829.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><rect x="858" y="271" width="50" height="64" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="883.0" y="296" class="mono" text-anchor="middle" fill="#0891b2" font-weight="700" font-size="13">10</text><text x="883.0" y="319" class="tiny" text-anchor="middle" fill="#5f6b7a" font-size="9">256 B</text><text x="48" y="356" class="small" text-anchor="start" fill="#5f6b7a">BSC 每确认一个应用层块加 1：01, 02, …, 0F, 10</text><text x="48" y="410" class="label" text-anchor="start" fill="#172033" font-weight="700">一个 258 字节 UDS PDU 的 ISO-TP 分片</text><rect x="48" y="430" width="148" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="122" y="458" class="mono" text-anchor="middle" fill="#2563eb" font-weight="700" font-size="16">FF · 6 B</text><text x="122" y="482" class="tiny" text-anchor="middle" fill="#5f6b7a">声明总长 258</text><line x1="204" y1="465" x2="250" y2="465" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#arrow-5f6b7a)"/><rect x="260" y="430" width="652" height="70" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="586" y="458" class="mono" text-anchor="middle" fill="#0891b2" font-weight="700" font-size="16">36 个 CF · 共 252 B</text><text x="586" y="482" class="mono" text-anchor="middle" fill="#5f6b7a" font-size="13">SN: 1…F, 0, 1…F, 0, 1, 2, 3, 4</text><rect x="48" y="540" width="414" height="104" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="540" width="6" height="104" rx="3" fill="#2563eb"/><text x="68" y="570" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">应用层 BSC</text><text x="68" y="597" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="68" dy="0">每个 TransferData 请求占一个计数值</tspan><tspan x="68" dy="1.35em">这里从 01 到 10（十六进制）</tspan></text><rect x="498" y="540" width="414" height="104" rx="12" fill="#ecfeff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="498" y="540" width="6" height="104" rx="3" fill="#0891b2"/><text x="518" y="570" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">传输层 CF SN</text><text x="518" y="597" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="518" dy="0">每个 CF 加 1，并按 4 bit 回绕</tspan><tspan x="518" dy="1.35em">每条新的 ISO-TP 消息重新从 SN=1 开始</tspan></text><rect x="218" y="668" width="524" height="38" rx="19.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.2"/><text x="480.0" y="692.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650" font-size="15">BSC 与 CF SN 是两个独立计数域，不能互相代替</text>
</svg>
