<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" role="img" aria-labelledby="title desc">
  <title id="title">Provider URI：系统权限、路由与方法授权分层判断</title>
  <desc id="desc">同一 content URI 依次经过系统访问判定、Provider 路由和操作方法内授权，最后才触及资源。</desc>
  <defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrow-16845b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16845b"/></marker><marker id="arrow-b96800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b96800"/></marker><marker id="arrow-c2413c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2413c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><style>
      .title { font:700 29px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .subtitle { font:400 15px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#5f6b7a; }
      .label { font:500 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#172033; }
      .small { font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .tiny { font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family:'Cascadia Mono',Consolas,monospace; fill:#172033; }
    </style></defs>
  <rect width="960" height="730" fill="#ffffff"/>
  <text x="48" y="48" class="title" text-anchor="start">Provider URI：系统权限、路由与方法授权分层判断</text>
  <text x="48" y="76" class="subtitle" text-anchor="start">同一 content URI 依次经过系统访问判定、Provider 路由和操作方法内授权，最后才触及资源。</text>
  <rect x="28" y="118" width="155" height="142" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="28" y="118" width="6" height="142" rx="3" fill="#2563eb"/><text x="48" y="148" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="15">同一个 URI</text><text x="48" y="175" class="small" text-anchor="start" fill="#5f6b7a" font-size="12"><tspan x="48" dy="0">content://…</tspan><tspan x="48" dy="1.4em">/Keys/</tspan></text><line x1="187" y1="189" x2="202" y2="189" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow-5f6b7a)"/><rect x="207" y="118" width="190" height="142" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="207" y="118" width="6" height="142" rx="3" fill="#7c3aed"/><text x="227" y="148" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="15">系统访问判定</text><text x="227" y="175" class="small" text-anchor="start" fill="#5f6b7a" font-size="12"><tspan x="227" dy="0">exported / 全局权限</tspan><tspan x="227" dy="1.4em">path-permission / grant</tspan></text><line x1="401" y1="189" x2="416" y2="189" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow-5f6b7a)"/><rect x="421" y="118" width="155" height="142" rx="12" fill="#ecfeff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="421" y="118" width="6" height="142" rx="3" fill="#0891b2"/><text x="441" y="148" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="15">UriMatcher</text><text x="441" y="175" class="small" text-anchor="start" fill="#5f6b7a" font-size="12"><tspan x="441" dy="0">选择路由 code</tspan><tspan x="441" dy="1.4em">不代替授权</tspan></text><line x1="580" y1="189" x2="595" y2="189" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow-5f6b7a)"/><rect x="600" y="118" width="200" height="142" rx="12" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/><rect x="600" y="118" width="6" height="142" rx="3" fill="#b96800"/><text x="620" y="148" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="15">方法内授权</text><text x="620" y="175" class="small" text-anchor="start" fill="#5f6b7a" font-size="12"><tspan x="620" dy="0">query / openFile</tspan><tspan x="620" dy="1.4em">主体、资源、参数</tspan></text><line x1="804" y1="189" x2="819" y2="189" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow-5f6b7a)"/><rect x="824" y="118" width="108" height="142" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/><rect x="824" y="118" width="6" height="142" rx="3" fill="#16845b"/><text x="844" y="148" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="15">资源</text><text x="844" y="175" class="small" text-anchor="start" fill="#5f6b7a" font-size="12"><tspan x="844" dy="0">行 / 文件</tspan><tspan x="844" dy="1.4em">Cursor / FD</tspan></text><text x="48" y="302" class="label" text-anchor="start" fill="#172033" font-weight="700">精确路径不是“看起来相近”</text><rect x="48" y="322" width="414" height="162" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="72" y="356" class="mono" text-anchor="start" fill="#7c3aed" font-weight="700" font-size="15">Manifest: path=&quot;/Keys&quot;</text><rect x="72" y="376" width="156" height="32" rx="16.0" fill="#ecfdf5" stroke="#16845b" stroke-width="1.2"/><text x="150.0" y="397.0" class="small" text-anchor="middle" fill="#16845b" font-weight="650" font-size="13">/Keys  ✓ 命中</text><rect x="246" y="376" width="174" height="32" rx="16.0" fill="#fff1f2" stroke="#c2413c" stroke-width="1.2"/><text x="333.0" y="397.0" class="small" text-anchor="middle" fill="#c2413c" font-weight="650" font-size="13">/Keys/  ✕ 不命中</text><text x="72" y="438" class="small" text-anchor="start" fill="#5f6b7a">path 是完整路径匹配；pathPrefix 范围更宽。</text><text x="72" y="463" class="small" text-anchor="start" fill="#5f6b7a">编码、末尾斜杠和规范化仍要按实际 URI 验证。</text><text x="498" y="302" class="label" text-anchor="start" fill="#172033" font-weight="700">某一规则未命中，不等于自动允许</text><rect x="498" y="322" width="414" height="162" rx="12" fill="#fff1f2" stroke="#cbd5e1" stroke-width="1.5"/><text x="522" y="354" class="small" text-anchor="start" fill="#c2413c" font-weight="700">还要继续核对</text><text x="522" y="382" class="small" text-anchor="start" fill="#5f6b7a" font-size="13"><tspan x="522" dy="0">• Provider 的全局 read / write 权限</tspan><tspan x="522" dy="1.4em">• 有效且覆盖本 URI 的临时 URI grant</tspan><tspan x="522" dy="1.4em">• query / openFile 分支中的代码检查</tspan><tspan x="522" dy="1.4em">• 调用主体、资源归属、列或打开模式</tspan></text><rect x="48" y="526" width="864" height="118" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="526" width="6" height="118" rx="3" fill="#2563eb"/><text x="68" y="556" class="label" text-anchor="start" fill="#172033" font-weight="700" font-size="18">每一层回答的问题不同</text><text x="68" y="583" class="small" text-anchor="start" fill="#5f6b7a" font-size="14"><tspan x="68" dy="0">系统组件与路径规则：这次 IPC 能否进入 Provider；UriMatcher：进入哪条代码分支；</tspan><tspan x="68" dy="1.4em">query/openFile：该主体能否以这些参数访问这个资源。只有组合结果才决定是否返回数据或文件描述符。</tspan></text><rect x="216" y="664" width="528" height="38" rx="19.0" fill="#fff7ed" stroke="#b96800" stroke-width="1.2"/><text x="480.0" y="688.0" class="small" text-anchor="middle" fill="#b96800" font-weight="650" font-size="15">路由命中是控制流证据，不是授权通过的证据</text>
</svg>
